<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Pernas em Dia</title>
<style>
:root{--bg:#f1f5f4;--card:#fff;--tx:#10201c;--mut:#5f706b;--pri:#0f766e;--pri2:#14b8a6;--h1:#0f766e;--h2:#14b8a6;--ok:#16a34a;--warn:#c2410c;--bd:#e3ebe8;--red:#b91c1c;--sh:0 1px 2px rgba(16,32,28,.05),0 10px 28px rgba(16,32,28,.07)}
:root.dk{--bg:#0b1211;--card:#141e1c;--tx:#e8f1ef;--mut:#9fb2ad;--bd:#25332f;--warn:#fb923c;--red:#f87171;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:104px}
main{max-width:640px;margin:0 auto;padding:12px 16px}
h1,h2,h3{letter-spacing:-.2px}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:26px;padding:20px;margin:4px 0 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0;font-size:25px;font-weight:800}
.hero p{margin:2px 0 0;opacity:.92;font-size:14px}
.chip{display:inline-block;background:rgba(255,255,255,.22);padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-top:8px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh);border:1px solid var(--bd)}
.card.hl{border:2px solid var(--pri)}
.card h2{margin:0 0 8px;font-size:18px;font-weight:800}
.card h3{margin:14px 0 4px;font-size:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:none;background:color-mix(in srgb,var(--pri) 14%,var(--card))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:15px}
button{font:inherit;border:0;border-radius:14px;padding:12px 18px;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;font-weight:700;min-height:48px;cursor:pointer;box-shadow:0 4px 12px color-mix(in srgb,var(--h1) 28%,transparent)}
button:active{transform:scale(.98)}
button.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri);box-shadow:none}
button.sm{padding:8px 14px;min-height:40px;font-size:15px}
button.gray{background:var(--bd);color:var(--tx);box-shadow:none}
button.block{width:100%}
button:disabled{opacity:.4;box-shadow:none}
.seg{display:flex;background:var(--bd);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;background:transparent;color:var(--mut);box-shadow:none;min-height:44px;padding:8px 6px;font-size:15px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 5px rgba(0,0,0,.18)}
.chipb{background:var(--card);color:var(--tx);border:1.5px solid var(--bd);box-shadow:none;text-align:left;width:100%;margin:4px 0;font-weight:600}
.chipb.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.swatch{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid var(--card);box-shadow:0 0 0 2px var(--bd)}
.swatch.on{box-shadow:0 0 0 3px var(--tx)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 6px;min-height:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:none;font-size:12px;font-weight:700}
.strip button.today{border:2px solid var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--card))}
.strip .e{font-size:19px;line-height:1.3}
.strip .dot{width:7px;height:7px;border-radius:50%;background:var(--bd)}
.strip .dot.on{background:var(--ok)}
.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));border-radius:99px;transition:width .3s}
.bar.done i{background:var(--ok)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bd);font-size:13px;font-weight:600}
.badge.ok{background:var(--ok);color:#fff}
.badge.warn{background:var(--warn);color:#fff}
.item{display:flex;gap:14px;align-items:flex-start}
nav{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
nav div{display:flex;width:100%;max-width:640px;background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:6px}
nav button{flex:1;background:none;box-shadow:none;color:var(--mut);min-height:54px;padding:6px 2px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:18px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,transparent)}
input[type=number],input[type=time],input[type=text],textarea,select{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx)}
input[type=number]{width:90px}
input[type=range]{width:100%;height:36px;accent-color:var(--pri)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:16px}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--pri)}
.warn{background:#fef3c7;color:#78350f;border:1px solid #f59e0b;border-radius:14px;padding:12px;font-size:15px;margin:12px 0}
.alert{background:#fee2e2;color:#7f1d1d;border:2px solid #ef4444;border-radius:16px;padding:14px;margin:12px 0}
:root.dk .warn{background:#3a2a0a;color:#fde68a}
:root.dk .alert{background:#3b1212;color:#fecaca}
.banner{position:sticky;top:0;z-index:6;background:var(--warn);color:#fff;padding:12px 16px;display:none;justify-content:space-between;align-items:center;gap:8px}
.banner.show{display:flex}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;overflow:auto}
.overlay.show{display:block}
.sheetin{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.run{--rc:var(--pri);max-width:none;min-height:100%;display:flex;flex-direction:column;padding:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 18%,var(--bg)),var(--bg) 60%)}
.run>*{width:100%;max-width:640px;margin-left:auto;margin-right:auto}
.run.k-mod{--rc:var(--warn)}.run.k-easy{--rc:var(--ok)}.run.k-rest{--rc:var(--mut)}
.run h2{font-size:26px;text-align:center;margin:6px 0;color:var(--rc)}
.run p{text-align:center;font-size:18px;margin:8px 0}
.ringbox{position:relative;width:240px;height:240px;margin:6px auto}
.ringbox .t{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;font-weight:800;color:var(--rc)}
.repbox{margin:14px auto;padding:20px;border-radius:22px;background:var(--card);border:2px solid var(--rc);font-size:34px;font-weight:800;text-align:center;color:var(--rc);box-shadow:var(--sh)}
.hist{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:8px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.hist i{width:100%;border-radius:8px 8px 0 0;background:var(--bd);min-height:4px}
.hist i.ok{background:var(--ok)}.hist i.cur{background:var(--pri)}
.hist span{font-size:11px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left;vertical-align:top}
.sess{padding:8px 0;border-top:1px solid var(--bd)}
.sess:first-child{border-top:0}
ul.l{margin:6px 0;padding-left:20px}
ul.l li{margin:4px 0}
a{color:var(--pri);font-weight:600}
@media print{:root.dk{--bg:#fff;--card:#fff;--tx:#000;--mut:#444;--bd:#bbb}nav,.banner,.noprint,.overlay,.pagehead{display:none!important}body{background:#fff;color:#000;padding:0;font-size:12pt}.card{box-shadow:none;border:1px solid #999;break-inside:avoid}}
</style>
</head>
<body>
<div class="banner" id="banner"><span id="bantext">⏰ Hora de mexer as pernas! Faça uma pausa ativa (com o carro parado).</span><button class="sm gray" data-act="closeBanner">OK</button></div>
<main id="app"></main>
<nav><div id="tabs"></div></nav>
<section id="runner" class="overlay"></section>
<section id="sheet" class="overlay"></section>

<script>
/* ============ Utilidades ============ */
const KEY='pernas-em-dia-v2';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>new Date(k+'T12:00:00');
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const daysSince=k=>Math.round((parseKey(todayKey())-parseKey(k))/864e5);
const fmtDate=k=>{const d=parseKey(k);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const dowOf=k=>parseKey(k).getDay();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>`${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;
const setText=(id,t)=>{const e=$(id);if(e)e.textContent=t};
const bar=(v,m)=>{const p=Math.min(100,Math.round(v/Math.max(1,m)*100));return `<div class="bar ${p>=100?'done':''}"><i style="width:${p}%"></i></div>`};
const SW=['nenhum','quase nada','leve','leve','moderado','moderado','notável','forte','forte','muito forte','máximo'];
const RP=['repouso','muito leve','muito leve','leve','leve','moderado','moderado','forte','forte','muito forte','máximo'];
const DOW=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DOWS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const ORDER=[1,2,3,4,5,6,0];
const MODES={casa:{ico:'🏠',n:'Casa'},rua:{ico:'🚶',n:'Rua'},descanso:{ico:'😴',n:'Descanso'}};
const PRESETS={
 alt:{n:'Alternar casa e rua',d:'Casa seg/qua/sex, rua ter/qui/sáb, descanso no domingo',m:['descanso','casa','rua','casa','rua','casa','rua']},
 fds:{n:'Casa na semana, rua no fim de semana',d:'Casa de seg a sex (menos quarta), rua sáb e dom',m:['rua','casa','casa','descanso','casa','casa','rua']},
 casa:{n:'Só em casa',d:'Casa de segunda a sábado, descanso no domingo',m:['descanso','casa','casa','casa','casa','casa','casa']},
 rua:{n:'Só na rua',d:'Rua de segunda a sábado, descanso no domingo',m:['descanso','rua','rua','rua','rua','rua','rua']}};
const mkPlan=m=>Object.fromEntries(m.map((x,i)=>[i,{mode:x,time:''}]));
const ACC={teal:['#0f766e','#14b8a6','#2dd4bf','Verde-água'],blue:['#1d4ed8','#3b82f6','#60a5fa','Azul'],purple:['#6d28d9','#8b5cf6','#a78bfa','Roxo'],orange:['#c2410c','#f97316','#fb923c','Laranja'],pink:['#be185d','#ec4899','#f472b6','Rosa']};

/* ============ Dados ============ */
const defaults=()=>({v:2,onboarded:false,profile:{name:'',doctor:''},week:1,weekStart:todayKey(),days:{},history:[],plan:mkPlan(PRESETS.alt.m),preset:'alt',accent:'teal',theme:'auto',set:{remind:60,voice:true,gps:false},last:Date.now()});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===2){const d=defaults();return{...d,...s,profile:{...d.profile,...s.profile},plan:{...d.plan,...(s.plan||{})},set:{...d.set,...s.set}}}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
let tab='hoje';
const D=(k=todayKey())=>S.days[k]||(S.days[k]={place:null,ci:null,sessions:[]});
const modeFor=k=>S.days[k]?.place||S.plan[dowOf(k)]?.mode||'casa';

/* ============ Tema e personalização ============ */
function applyTheme(){
  try{
    const mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');
    const dark=S.theme==='dark'||(S.theme==='auto'&&!!mq&&mq.matches);
    const root=document.documentElement,a=ACC[S.accent]||ACC.teal;
    root.classList.toggle('dk',dark);
    root.style.setProperty('--h1',a[0]);root.style.setProperty('--h2',a[1]);
    root.style.setProperty('--pri',dark?a[2]:a[0]);root.style.setProperty('--pri2',dark?a[0]:a[1]);
    const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',a[0]);
  }catch(e){}
}
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}

/* ============ Programa de 8 semanas ============ */
const PROG=[
 {w:1,aero:60, sess:15,str:2,sets:2,lvl:0,brk:4,mod:2,easy:2},
 {w:2,aero:80, sess:20,str:2,sets:2,lvl:0,brk:4,mod:3,easy:2},
 {w:3,aero:100,sess:25,str:2,sets:2,lvl:1,brk:4,mod:3,easy:2},
 {w:4,aero:120,sess:30,str:2,sets:2,lvl:1,brk:4,mod:4,easy:2},
 {w:5,aero:135,sess:30,str:3,sets:3,lvl:2,brk:4,mod:4,easy:2},
 {w:6,aero:150,sess:30,str:3,sets:3,lvl:2,brk:4,mod:5,easy:2},
 {w:7,aero:150,sess:35,str:3,sets:3,lvl:3,brk:4,mod:5,easy:1},
 {w:8,aero:150,sess:35,str:3,sets:3,lvl:3,brk:4,mod:6,easy:1}];
const prog=()=>PROG[Math.min(Math.max(S.week,1),PROG.length)-1];

const FLAGS=[
 'Inchaço novo ou que aumentou de repente, principalmente em uma perna só',
 'Dor ou sensibilidade na panturrilha que não parece de esforço (não passa, dói ao tocar)',
 'Vermelhidão, calor ou pele esticada e brilhante na perna',
 'Falta de ar repentina, dor no peito, tontura ou batimento muito acelerado'];

const KINDS={
 walk:{ico:'🚶',n:'Caminhada em intervalos'},
 cardio:{ico:'🏠',n:'Cardio em casa (marcha)'},
 strength:{ico:'💪',n:'Força em casa'},
 stretch:{ico:'🧘',n:'Alongamento e mobilidade'},
 sit:{ico:'💺',n:'Pausa sentado'},
 stand:{ico:'🧍',n:'Pausa em pé'}};
const LOGK={walk:'walk',cardio:'cardio',strength:'strength',stretch:'stretch',sit:'break',stand:'break'};

/* ============ Segurança: check-in diário ============ */
function gate(ci){
  if(!ci)return{lv:'none',msg:'Faça o check-in de hoje antes de treinar.'};
  const f=ci.flags||[];
  if(f.includes(3))return{lv:'emergency',msg:'Esses sinais podem indicar algo grave. Ligue 192 (SAMU) ou vá a um pronto-socorro agora. Não faça exercícios.'};
  if(f.length)return{lv:'stop',msg:'Não treine hoje. Esses sinais precisam de avaliação médica: fale com sua médica ou procure atendimento ainda hoje.'};
  if(ci.pain>=7||ci.swell>=8)return{lv:'rest',msg:'Dor ou inchaço altos hoje. Hoje é dia de descanso ativo: só alongamento e pausas leves. Se continuar assim por dias, fale com sua médica.'};
  if(ci.pain>=4||ci.swell>=6)return{lv:'light',msg:'Dia de volume reduzido: as sessões ficam mais curtas e sem os exercícios mais exigentes. Observe como as pernas respondem.'};
  return{lv:'ok',msg:'Tudo certo para o plano de hoje.'};
}
const canDo=k=>{const g=gate(D().ci).lv;const heavy=['walk','cardio','strength'].includes(k);
  if(g==='stop'||g==='emergency')return false;
  return heavy?(g==='ok'||g==='light'):true};

/* ============ Estatísticas ============ */
const weekKeys=()=>Array.from({length:7},(_,i)=>addDays(S.weekStart,i));
function statsFor(keys){
  let aero=0,str=0,brk=0,flags=0,ci=0;const sw=[],pn=[];
  for(const k of keys){const d=S.days[k];if(!d)continue;
    for(const s of d.sessions){
      if(s.kind==='walk'||s.kind==='cardio')aero+=s.min;
      else if(s.kind==='strength')str++;
      else if(s.kind==='break'||s.kind==='stretch')brk++;}
    if(d.ci){ci++;sw.push(d.ci.swell);pn.push(d.ci.pain);if((d.ci.flags||[]).length)flags++}}
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:null;
  return{aero,str,brk,swell:avg(sw),pain:avg(pn),flags,ci};
}
const weekStats=()=>statsFor(weekKeys());
const allSessions=()=>Object.values(S.days).flatMap(d=>d.sessions).sort((a,b)=>a.ts-b.ts);
const HEAVY=['walk','cardio','strength'];

/* ============ Exercícios ============ */
const HOME_EX=[
 {id:'sit',n:'Levantar e sentar da cadeira',how:'Sentado na ponta de uma cadeira firme (encostada na parede), levante-se sem se apoiar nas mãos, se conseguir, e sente devagar, em cerca de 3 segundos.',reps:[8,10,12,12]},
 {id:'calf',n:'Elevação de panturrilha em pé',how:'Em pé, com as mãos apoiadas na parede ou bancada. Suba nas pontas dos pés, segure 1 segundo e desça devagar.',reps:[10,12,15,20]},
 {id:'bridge',n:'Ponte de glúteos',how:'Deitado de barriga para cima, joelhos dobrados e pés no chão. Suba o quadril até alinhar com o tronco, segure 1 segundo e desça.',reps:[8,10,12,15]},
 {id:'lat',n:'Elevação lateral da perna',how:'Em pé, apoiado na parede, afaste uma perna para o lado sem inclinar o tronco. Faça de um lado e depois do outro.',reps:[8,10,12,15],side:true},
 {id:'ext',n:'Extensão de joelho sentado',how:'Sentado, estique um joelho até a perna ficar quase reta (sem travar), segure 2 segundos e desça devagar. Faça dos dois lados.',reps:[8,10,12,15],side:true},
 {id:'wall',n:'Agachamento na parede (parcial)',how:'Costas na parede, desça só um pouco, bem menos que 90°. Pare se sentir pressão ou dor atrás do joelho.',secs:[0,10,15,25],minLevel:1}];
const T=(n,text,secs,k)=>({n,text,secs,k});
const Rp=(n,text,reps,k)=>({n,text,reps,k});
const stretchSteps=()=>[
 T('Alongar panturrilha (direita)','Mãos na parede, perna de trás esticada com o calcanhar no chão. Incline o corpo à frente até sentir puxar, sem dor.',30,'cool'),
 T('Alongar panturrilha (esquerda)','Troque de perna. Alongue devagar, sem balançar.',30,'cool'),
 T('Alongar atrás da coxa (direita)','Sentado na ponta da cadeira, estique a perna com o calcanhar no chão e a ponta do pé para cima. Incline o tronco reto, sem dor atrás do joelho.',30,'cool'),
 T('Alongar atrás da coxa (esquerda)','Troque de perna, com a mesma suavidade.',30,'cool')];
const ankle=s=>T('Círculos com os tornozelos','Gire os pés em círculos, metade do tempo para cada lado.',s,'warm');

const ROUT={
 sit:[T('Bombeamento de tornozelo','Levante a ponta dos pés e depois os calcanhares, alternando, em ritmo contínuo.',40,'work'),
  ankle(40),
  T('Extensão de joelho','Estique uma perna à altura do quadril, segure 2 segundos e desça. Alterne as pernas.',60,'work'),
  T('Elevação de panturrilha sentado','Com os pés no chão, suba os calcanhares e desça devagar.',45,'work'),
  T('Marcha sentado','Levante um joelho de cada vez, como se marchasse.',45,'work')],
 stand:[T('Marcha no lugar','Levante os joelhos em ritmo confortável.',60,'work'),
  T('Elevação de panturrilha','Suba nas pontas dos pés e desça devagar. Apoie-se no carro se precisar.',45,'work'),
  T('Agachamento parcial','Agache só até onde for confortável, com a coluna reta e sem forçar o joelho.',45,'work'),
  T('Caminhada leve','Ande em volta do carro ou pela calçada, com passos firmes.',60,'work'),
  ...stretchSteps().slice(0,2)]
};

function buildWalk(kind,light){
  const p=prog();
  const total=Math.max(8,Math.round(p.sess*(light?0.6:1)));
  const warm=total>=20?3:2,cool=total>=20?3:2;
  const mod=light?1:p.mod,easy=light?2:p.easy;
  const names=['Marcha rápida no lugar','Passos laterais','Marcha com joelhos altos'];
  const st=[];let main=total-warm-cool,isMod=true,n=0;
  st.push(T('Aquecimento',kind==='walk'?'Caminhe em ritmo leve: dá para conversar e até cantar.':'Marcha leve no lugar, com balanço natural dos braços.',warm*60,'warm'));
  while(main>0){
    const len=Math.min(isMod?mod:easy,main);
    if(isMod)st.push(T(kind==='walk'?'Ritmo moderado':names[n++%names.length],
      kind==='walk'?'Passos mais rápidos e respiração mais forte, mas ainda consegue falar frases inteiras (teste da fala).':'Ritmo mais forte, sem pulos. Você deve conseguir falar frases, mas não cantar.',len*60,'mod'));
    else st.push(T('Ritmo leve','Reduza o ritmo para recuperar o fôlego.',len*60,'easy'));
    main-=len;isMod=!isMod;
  }
  st.push(T('Desaceleração','Diminua o ritmo aos poucos e respire fundo.',cool*60,'cool'));
  st.push(...stretchSteps().slice(0,2));
  return st;
}
function buildStrength(light){
  const p=prog();
  const sets=light?Math.max(1,p.sets-1):p.sets,f=light?0.7:1;
  const list=HOME_EX.filter(e=>!(e.minLevel>p.lvl)&&!(light&&e.id==='wall'));
  const st=[T('Aquecimento','Marcha leve no lugar e círculos com os tornozelos.',120,'warm')];
  list.forEach((e,ei)=>{
    for(let s=1;s<=sets;s++){
      const title=`${e.n} · série ${s}/${sets}`;
      if(e.secs)st.push(T(title,e.how,Math.max(8,Math.round(e.secs[p.lvl]*f)),'work'));
      else st.push(Rp(title,e.how,`${Math.max(5,Math.round(e.reps[p.lvl]*f))} repetições${e.side?' de cada lado':''}`,'work'));
      const last=(s===sets&&ei===list.length-1);
      if(!last)st.push(T('Descanse',s<sets?`Respire. Próxima série: ${e.n}.`:`Respire. Próximo exercício: ${list[ei+1].n}.`,s<sets?45:60,'rest'));
    }
  });
  st.push(...stretchSteps());
  return st;
}
function buildSteps(kind,light){
  if(kind==='walk'||kind==='cardio')return buildWalk(kind,light);
  if(kind==='strength')return buildStrength(light);
  if(kind==='stretch')return [ankle(40),...stretchSteps()];
  return ROUT[kind];
}

/* ============ Plano semanal e sugestão do dia ============ */
function planCheck(){
  const p=prog();
  const modes=ORDER.map(i=>S.plan[i].mode);
  const casa=modes.filter(m=>m==='casa').length,rua=modes.filter(m=>m==='rua').length,desc=modes.filter(m=>m==='descanso').length;
  const act=casa+rua,need=Math.ceil(p.aero/p.sess);
  const msgs=[];
  if(act<need)msgs.push(`Para a meta aeróbica da semana ${S.week} (${p.aero} min) você precisa de cerca de ${need} dias ativos de ${p.sess} min. Seu plano tem ${act}.`);
  else msgs.push(`Seu plano cobre a meta aeróbica da semana ${S.week} (cerca de ${need} dias ativos de ${p.sess} min). ✅`);
  msgs.push(`Força (${p.str}x por semana): faça em dias de casa ou ao chegar em casa nos dias de rua, sem treinar dois dias seguidos.`);
  return{casa,rua,desc,msgs};
}
function suggest(){
  const p=prog(),ws=weekStats(),d=D(),g=gate(d.ci),place=modeFor(todayKey());
  if(g.lv==='stop'||g.lv==='emergency')return null;
  if(g.lv==='none')return{kind:'checkin'};
  if(g.lv==='rest')return{kind:'stretch',reason:'Hoje é descanso ativo: alongamento e mobilidade ajudam sem sobrecarregar.'};
  if(place==='descanso')return{kind:'stretch',rest:true,reason:'Hoje é dia de descanso no seu plano. Um alongamento leve ajuda, mas é opcional.'};
  const idx=Math.min(6,Math.max(0,daysSince(S.weekStart)));
  const daysLeft=Math.max(1,7-idx);
  const needStr=p.str-ws.str,aeroLeft=p.aero-ws.aero;
  const todayStr=d.sessions.some(s=>s.kind==='strength');
  const todayAero=d.sessions.filter(s=>s.kind==='walk'||s.kind==='cardio').reduce((a,s)=>a+s.min,0);
  const y=S.days[addDays(todayKey(),-1)];
  const yStr=!!y&&y.sessions.some(s=>s.kind==='strength');
  if(needStr>0&&!todayStr&&!yStr&&(place==='casa'||needStr>=daysLeft))
    return{kind:'strength',reason:`Você fez ${ws.str} de ${p.str} treinos de força nesta semana. Força em pelo menos 2 dias por semana faz parte das diretrizes da OMS.${place==='rua'?' Faça quando chegar em casa.':''}`};
  if(aeroLeft>0&&todayAero<p.sess*0.8)
    return{kind:place==='rua'?'walk':'cardio',reason:`Faltam ${aeroLeft} min de atividade aeróbica moderada nesta semana (meta: ${p.aero} min).`};
  return{kind:'stretch',done:true,reason:'Meta do dia cumprida. Se quiser, faça um alongamento ou uma pausa ativa.'};
}
function setPlanMode(i,m){
  S.plan[i].mode=m;
  if(i===new Date().getDay()&&S.days[todayKey()])S.days[todayKey()].place=null;
  S.preset=null;save();
}
function applyPreset(k){
  const pr=PRESETS[k];if(!pr)return;
  pr.m.forEach((m,i)=>{S.plan[i].mode=m});
  if(S.days[todayKey()])S.days[todayKey()].place=null;
  S.preset=k;save();
}

/* ============ Revisão semanal ============ */
function weekReview(){
  const p=prog(),ws=weekStats(),prev=S.history[S.history.length-1];
  const why=[];let rec;
  const swUp=prev&&prev.swell!=null&&ws.swell!=null&&ws.swell-prev.swell>=1.5;
  if(ws.flags>0){rec='repetir';why.push('Houve dia com sinal de alerta. Converse com sua médica antes de aumentar a carga.')}
  else if((ws.pain!=null&&ws.pain>=6)||(ws.swell!=null&&ws.swell>=7)){rec='reduzir';why.push('Dor ou inchaço médios altos. Vale reduzir a carga e falar com sua médica.')}
  else if(swUp||(ws.pain!=null&&ws.pain>=4.5)){rec='repetir';why.push(swUp?'O inchaço médio subiu em relação à semana anterior.':'A dor média ficou acima do ideal.')}
  else if(ws.ci<3){rec='repetir';why.push('Poucos check-ins na semana. Sem eles não dá para avaliar com segurança.')}
  else if(ws.aero<p.aero*0.7||ws.str<Math.min(2,p.str)){rec='repetir';why.push('O volume da semana ficou abaixo de 70% da meta aeróbica ou abaixo de 2 treinos de força.')}
  else{rec='avancar';why.push('Volume cumprido e sintomas estáveis.')}
  return{ws,p,prev,rec,why,block:ws.flags>0};
}
function closeWeek(dec){
  const r=weekReview();
  S.history.push({week:S.week,start:S.weekStart,aero:r.ws.aero,aeroT:r.p.aero,str:r.ws.str,strT:r.p.str,swell:r.ws.swell,pain:r.ws.pain,flags:r.ws.flags,ci:r.ws.ci,dec});
  if(dec==='avancar')S.week=Math.min(S.week+1,PROG.length);
  if(dec==='reduzir')S.week=Math.max(1,S.week-1);
  S.weekStart=todayKey();save();closeSheet();render();
}

  const x=i=>L+iw*i/(n-1),y=v=>Tp+ih*(1-v/10);
  const series=(f,c)=>{let path='',dots='',pen=false;
    keys.forEach((k,i)=>{const ci=S.days[k]?.ci;if(!ci){pen=false;return}
      const px=x(i).toFixed(1),py=y(ci[f]).toFixed(1);path+=(pen?'L':'M')+px+' '+py+' ';pen=true;
      dots+=`<circle cx="${px}" cy="${py}" r="3" style="fill:${c}"/>`});
    return `<path d="${path}" fill="none" stroke-width="2.5" stroke-linejoin="round" style="stroke:${c}"/>${dots}`};
  const grid=[0,5,10].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--bd)"/><text x="2" y="${y(v)+4}" font-size="10" style="fill:var(--mut)">${v}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de inchaço e dor nos últimos ${n} dias">${grid}${series('swell','var(--pri)')}${series('pain','var(--warn)')}
   <text x="${L}" y="${H-5}" font-size="10" style="fill:var(--mut)">${fmtDate(keys[0])}</text><text x="${W-R}" y="${H-5}" font-size="10" text-anchor="end" style="fill:var(--mut)">hoje</text></svg>
   <div class="row mut"><span><b style="color:var(--pri)">●</b> Inchaço</span><span><b style="color:var(--warn)">●</b> Dor</span></div>`;
}
function histBars(){
  const p=prog(),ws=weekStats();
  const items=[...S.history.slice(-7).map(h=>({l:'S'+h.week,pct:Math.min(100,Math.round(h.aero/Math.max(1,h.aeroT)*100)),ok:h.aero>=h.aeroT*0.7})),{l:'Atual',pct:Math.min(100,Math.round(ws.aero/p.aero*100)),cur:true}];
  return `<div class="hist">${items.map(i=>`<div><i class="${i.cur?'cur':i.ok?'ok':''}" style="height:${Math.max(4,i.pct)}%"></i><span>${i.l}</span></div>`).join('')}</div><p class="mut" style="margin:6px 0 0">Altura = % da meta aeróbica da semana. Verde = ao menos 70%.</p>`;
}

  const cis=[];for(let i=13;i>=0;i--){const k=addDays(todayKey(),-i);const c=S.days[k]?.ci;if(c)cis.push({k,c})}
  const head=[`Relatório de acompanhamento - Pernas em Dia`,`Gerado em ${new Date().toLocaleDateString('pt-BR')}`,S.profile.name?`Nome: ${S.profile.name}`:null,`Programa: semana ${S.week} de ${PROG.length} (início da semana atual: ${fmtDate(S.weekStart)})`,S.profile.doctor?`Orientações registradas pela paciente: ${S.profile.doctor}`:null].filter(Boolean);

   <table><tr><th>Período</th><th>Aeróbico (min)</th><th>Força</th><th>Inchaço médio</th><th>Dor média</th><th>Check-ins</th><th>Alertas</th></tr>

   <p class="mut">Dados de autoavaliação registrados em um app, sem valor de diagnóstico.</p>`;

/* ============ Sessão guiada ============ */
let RUN=null,PEND=null,AC=null;
const STEPK={warm:'Aquecimento',work:'Exercício',mod:'Ritmo moderado',easy:'Ritmo leve',rest:'Descanso',cool:'Desaceleração'};
function beep(f=880,d=.25){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=f;g.gain.value=.15;o.start();o.stop(AC.currentTime+d)}catch(e){}}
function speak(t){if(!S.set.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){}}
function cue(s){beep();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}speak(s.secs?`${s.n}. ${s.secs>=60?Math.round(s.secs/60*10)/10+' minutos':s.secs+' segundos'}.`:`${s.n}. ${s.reps}.`)}
const hav=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.la-a.la),dn=r(b.lo-a.lo);const h=Math.sin(dl/2)**2+Math.cos(r(a.la))*Math.cos(r(b.la))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};

async function lockScreen(){try{if(RUN&&navigator.wakeLock)RUN.wl=await navigator.wakeLock.request('screen')}catch(e){}}
function startSession(kind){
  const g=gate(D().ci),heavy=HEAVY.includes(kind);
  if(g.lv==='none'&&heavy){openCheckin();return}
  if(!canDo(kind)){sheet(`<h2>Hoje não</h2><p>${esc(g.msg)}</p><button data-act="closeSheet">OK</button>`);return}
  const light=g.lv==='light'&&heavy;
  RUN={kind,steps:buildSteps(kind,light),i:0,light,startedAt:Date.now(),pausedMs:0,paused:false,dist:0,lb:-1,lastPos:null,watch:null,wl:null};
  const s=RUN.steps[0];if(s.secs)RUN.endAt=Date.now()+s.secs*1000;
  lockScreen();
  if(kind==='walk'&&S.set.gps&&navigator.geolocation){
    RUN.watch=navigator.geolocation.watchPosition(p=>{
      if(!RUN||RUN.paused||p.coords.accuracy>40)return;
      const c={la:p.coords.latitude,lo:p.coords.longitude};
      if(!RUN.lastPos){RUN.lastPos=c;return}
      const m=hav(RUN.lastPos,c);if(m>=5&&m<150){RUN.dist+=m;RUN.lastPos=c}
    },()=>{},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  }
  drawRun();cue(s);
}
function drawRun(){
  const s=RUN.steps[RUN.i],nx=RUN.steps[RUN.i+1],m=KINDS[RUN.kind];
  $('runner').innerHTML=`<div class="run k-${s.k}">
   <div class="row sp"><b>${m.ico} ${m.n}${RUN.light?' · leve':''}</b><span class="mut" id="r_el"></span></div>
   <div class="bar"><i id="r_bar"></i></div>
   <div class="mut" style="display:flex;justify-content:space-between"><span>Passo ${RUN.i+1} de ${RUN.steps.length}</span><b style="color:var(--rc)">${STEPK[s.k]||''}</b></div>
   ${RUN.kind==='sit'?'<div class="warn">Só com o veículo parado, em local seguro.</div>':''}
   <h2>${esc(s.n)}</h2>
   ${s.secs?`<div class="ringbox"><svg viewBox="0 0 240 240" width="240" height="240" aria-hidden="true"><circle cx="120" cy="120" r="106" fill="none" stroke-width="12" style="stroke:var(--bd)"/><circle id="r_ring" cx="120" cy="120" r="106" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="666" stroke-dashoffset="0" transform="rotate(-90 120 120)" style="stroke:var(--rc)"/></svg><div class="t" id="r_t"></div></div>`:`<div class="repbox" id="r_t"></div>`}
   <p>${esc(s.text)}</p>
   ${nx?`<p class="mut" style="font-size:16px">Próximo: ${esc(nx.n)}</p>`:''}
   <div id="r_d" class="mut" style="text-align:center"></div>
   <div class="row" style="margin-top:auto;justify-content:center;padding-top:12px">
    ${s.secs?`<button class="sec" data-act="rpause">${RUN.paused?'▶ Continuar':'⏸ Pausar'}</button>`:`<button data-act="rnext">✓ Feito</button>`}
    <button class="sec" data-act="rskip">Pular ⏭</button>
    <button class="sec" data-act="rvoice" aria-label="Voz">${S.set.voice?'🔊':'🔇'}</button>
    <button class="gray" data-act="rend">Encerrar</button></div></div>`;
  $('runner').classList.add('show');tickRun();
}
function tickRun(){
  if(!RUN)return;
  const s=RUN.steps[RUN.i],now=RUN.paused?RUN.pausedAt:Date.now();
  setText('r_el',fmt(Math.max(0,now-RUN.startedAt-RUN.pausedMs)/1000));
  if(s.secs){
    const left=Math.max(0,Math.ceil((RUN.endAt-now)/1000));
    setText('r_t',fmt(left));
    const rg=$('r_ring');if(rg&&rg.setAttribute)rg.setAttribute('stroke-dashoffset',(666*(1-Math.min(1,left/s.secs))).toFixed(1));
    if(left<=3&&left>0&&RUN.lb!==left&&!RUN.paused){RUN.lb=left;beep(660,.08)}
  }else setText('r_t',s.reps);
  const br=$('r_bar');if(br)br.style.width=Math.round(RUN.i/RUN.steps.length*100)+'%';
  setText('r_d',RUN.kind==='walk'&&S.set.gps?`📍 ${(RUN.dist/1000).toFixed(2)} km`:'');
}
function runTick(){
  if(!RUN||RUN.paused)return;
  let guard=0;
  while(RUN&&!RUN.paused&&guard++<40){
    const s=RUN.steps[RUN.i];
    if(s&&s.secs&&Date.now()>=RUN.endAt)advance(true);else break;
  }
  if(RUN)tickRun();
}
function advance(fromTimer){
  const prev=RUN.steps[RUN.i];
  const base=(fromTimer&&prev.secs)?RUN.endAt:Date.now();
  RUN.i++;
  if(RUN.i>=RUN.steps.length)return finishRun(false);
  const s=RUN.steps[RUN.i];
  if(s.secs)RUN.endAt=base+s.secs*1000;
  RUN.lb=-1;drawRun();cue(s);
}
function stopRun(){
  if(!RUN)return;
  try{RUN.wl&&RUN.wl.release()}catch(e){}
  try{RUN.watch!=null&&navigator.geolocation.clearWatch(RUN.watch)}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
}
function finishRun(partial){
  const r=RUN;stopRun();RUN=null;
  const now=r.paused?r.pausedAt:Date.now();
  const min=Math.max(0,Math.round((now-r.startedAt-r.pausedMs)/60000));
  $('runner').classList.remove('show');$('runner').innerHTML='';
  PEND={kind:r.kind,log:LOGK[r.kind],min,light:r.light,dist:Math.round(r.dist||0)};
  const quick=PEND.log==='break'||PEND.log==='stretch';
  if(quick){if(partial&&min<1){PEND=null;render();return}PEND.min=Math.max(1,min);savePend({});return}
  if(min<2){PEND=null;sheet('<h2>Sessão muito curta</h2><p>Não registrei porque durou menos de 2 minutos.</p><button data-act="closeSheet">OK</button>');render();return}
  sheet(`<h2>${partial?'Sessão encerrada':'🎉 Sessão concluída'}</h2><p>${KINDS[PEND.kind].n}: <b>${min} min</b>${PEND.dist?` · ${(PEND.dist/1000).toFixed(2)} km`:''}</p>
   <label>Esforço percebido: <b id="rp_o">5 · ${RP[5]}</b></label><input type="range" min="0" max="10" value="5" id="rp" data-lab="rp">
   <p class="mut" style="margin-top:0">Na caminhada e no cardio, o alvo é 4 a 6 (consegue falar frases).</p>
   <h3>Como ficaram as pernas?</h3>
   <div class="row"><button data-act="savepend" data-v="melhor">Melhor</button><button class="sec" data-act="savepend" data-v="igual">Igual</button><button class="sec" data-act="savepend" data-v="pior">Pior</button></div>
   <button class="gray block" style="margin-top:14px" data-act="discard">Descartar sessão</button>`);
}
function savePend(extra){
  const s={kind:PEND.log,sub:PEND.kind,min:PEND.min,light:PEND.light,dist:PEND.dist,ts:Date.now(),...extra};
  D().sessions.push(s);S.last=Date.now();PEND=null;save();
  const msgs=[];
  if(s.after==='pior'){
    const rec=allSessions().filter(x=>x.after).slice(-2);
    msgs.push(rec.length===2&&rec.every(x=>x.after==='pior')?'As pernas pioraram depois das duas últimas sessões. Reduza o volume e converse com sua médica antes de seguir.':'Pernas piores depois do treino: na próxima vez faça uma versão mais leve e observe.');
  }
  if(s.rpe>=8)msgs.push('Esforço muito alto. Diminua o ritmo na próxima sessão.');
  if((s.kind==='walk'||s.kind==='cardio')&&s.rpe!=null&&s.rpe<=2)msgs.push('Esforço bem leve. Se estiver confortável, acelere um pouco nos blocos moderados.');
  if(s.kind==='break'||s.kind==='stretch'){const n=D().sessions.filter(x=>x.kind==='break'||x.kind==='stretch').length;msgs.push(`Pausas hoje: ${n}/${prog().brk}.`)}
  sheet(`<h2>✅ Registrado</h2>${msgs.map(m=>`<p>${esc(m)}</p>`).join('')||'<p>Bom trabalho! Cada sessão conta.</p>'}<button data-act="closeSheet">OK</button>`);
  render();
}

/* ============ Eventos ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,di=b.dataset.d!=null?Number(b.dataset.d):null;
  if(a==='tab'){e.preventDefault();tab=v;render();window.scrollTo(0,0)}
  else if(a==='onboard'){
    if(!$('ob_ok1').checked||!$('ob_ok2').checked){alert('Marque as duas confirmações para continuar.');return}
    S.onboarded=true;S.weekStart=todayKey();S.last=Date.now();save();render();
  }
  else if(a==='preset'){applyPreset(v);render()}
  else if(a==='accent'){S.accent=v;save();render()}
  else if(a==='theme'){S.theme=v;save();render()}
  else if(a==='plan'){setPlanMode(di,v);if(b.dataset.from==='sheet')openPlanDay(di);render()}
  else if(a==='planday')openPlanDay(di);
  else if(a==='savetime'){S.plan[di].time=($('pt_time').value||'');save();closeSheet();render()}
  else if(a==='checkin'){e.preventDefault();openCheckin()}
  else if(a==='saveci')saveCheckin();
  else if(a==='closeSheet')closeSheet();
  else if(a==='place'){D().place=v;save();render()}
  else if(a==='start')startSession(v);
  else if(a==='rpause'){if(RUN.paused){const dt=Date.now()-RUN.pausedAt;RUN.pausedMs+=dt;if(RUN.endAt)RUN.endAt+=dt;RUN.paused=false}else{RUN.paused=true;RUN.pausedAt=Date.now()}drawRun()}
  else if(a==='rnext'||a==='rskip')advance(false);
  else if(a==='rvoice'){S.set.voice=!S.set.voice;save();if(!S.set.voice){try{speechSynthesis.cancel()}catch(x){}}drawRun()}
  else if(a==='rend'){if(confirm('Encerrar a sessão agora? Você poderá registrar o que já fez.'))finishRun(true)}
  else if(a==='savepend'){savePend({rpe:Number($('rp').value),after:v})}
  else if(a==='discard'){PEND=null;closeSheet()}
  else if(a==='review')openReview();
  else if(a==='closeweek')closeWeek(v);
  else if(a==='manual')openManual();
  else if(a==='savemanual'){const k=$('mn_k').value,m=Math.max(1,Number($('mn_m').value)||1);D().sessions.push({kind:k,sub:k,min:m,manual:true,ts:Date.now()});S.last=Date.now();save();closeSheet();render()}
  else if(a==='remind'){S.set.remind=Number(v);S.last=Date.now();save();render()}
  else if(a==='toggle'){S.set[v]=!S.set[v];save();render()}
  else if(a==='notif'){if('Notification'in window)Notification.requestPermission().then(()=>alert('Pronto. As notificações só chegam com o app aberto.'));else alert('Seu navegador não suporta notificações.')}
  else if(a==='closeBanner'){$('banner').classList.remove('show');S.last=Date.now();save()}
  else if(a==='print')window.print();
  else if(a==='copyrep'){const t=buildReport().text;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Relatório copiado.')).catch(()=>prompt('Copie o texto:',t))}
  else if(a==='export'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='pernas-em-dia-backup.json';l.click()}
  else if(a==='importbtn')$('imp').click();
  else if(a==='restart'){if(confirm('Voltar para a semana 1? O histórico de dias é mantido.')){S.week=1;S.weekStart=todayKey();save();render()}}
  else if(a==='reset'){if(confirm('Apagar todo o histórico e as configurações?')){S=defaults();save();render()}}
});
document.addEventListener('input',e=>{
  const t=e.target;if(t.type==='range'&&t.dataset.lab){setText(t.id+'_o',`${t.value} · ${(t.dataset.lab==='rp'?RP:SW)[t.value]}`)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.prof){S.profile[t.dataset.prof]=t.value.trim();save()}
  if(t.dataset.time!=null&&t.dataset.time!==''){S.plan[Number(t.dataset.time)].time=t.value||'';save()}
  if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.v!==2)throw 0;S={...defaults(),...o};save();render();alert('Backup importado.')}catch(x){alert('Arquivo inválido.')}};r.readAsText(t.files[0])}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&RUN){lockScreen();runTick()}});
setInterval(()=>{if(RUN)runTick()},250);

/* Avisos (com o app aberto): horário do treino planejado e pausa */
function showBanner(t){setText('bantext',t);$('banner').classList.add('show');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{if('Notification'in window&&Notification.permission==='granted')new Notification('Pernas em Dia',{body:t})}catch(e){}}
setInterval(()=>{
  if(!S.onboarded||RUN)return;
  const now=new Date(),k=todayKey(),pl=S.plan[now.getDay()],d=S.days[k];
  if(pl&&pl.time&&modeFor(k)!=='descanso'&&!(d&&d.notified)){
    const [hh,mm]=pl.time.split(':').map(Number),mins=now.getHours()*60+now.getMinutes();
    const done=d&&d.sessions.some(s=>HEAVY.includes(s.kind));
    if(!done&&mins>=hh*60+mm&&mins<hh*60+mm+45){D().notified=true;save();showBanner(`${MODES[modeFor(k)].ico} Hora do seu treino (${MODES[modeFor(k)].n}). Abra a aba Hoje.`);return}
  }
  if(S.set.remind&&Date.now()-S.last>=S.set.remind*60000){
    showBanner('⏰ Hora de mexer as pernas! Faça uma pausa ativa (com o carro parado).');
    S.last=Date.now()-S.set.remind*60000+5*60000;save();
  }
},30000);

applyTheme();
render();
</script>
