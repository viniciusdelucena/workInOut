<!doctype html>
<html lang="pt-BR">
<head>

<title>Pernas em Dia</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--tx:#0e1a18;--mut:#526070;--bd:#e5e9ee;--h1:#0e7068;--h2:#0c8479;--pri:#0e7068;--grad:linear-gradient(135deg,#0e7068,#0c8479);--soft:rgba(14,112,104,.10);--soft2:rgba(14,112,104,.24);--ok:#15803d;--okt:#166534;--warn:#c2410c;--wt:#9a3412;--red:#dc2626;--rt:#b91c1c;--nav:rgba(255,255,255,.86);--sh:0 1px 2px rgba(14,26,24,.04),0 10px 30px rgba(14,26,24,.06)}
:root.dk{--bg:#090e0e;--card:#131a1a;--tx:#ecf3f1;--mut:#98a8a5;--bd:#223030;--nav:rgba(19,26,26,.86);--ok:#4ade80;--okt:#4ade80;--warn:#fb923c;--wt:#fb923c;--red:#f87171;--rt:#f87171;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
main{max-width:600px;margin:0 auto;padding:0 18px}
h1,h2,h3{letter-spacing:-.02em}
.i{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 0 8px}
.top h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut);font-size:15px}
.foot{color:var(--mut);font-size:13px;text-align:center;margin:18px 8px 0}
.lab{font-weight:700;font-size:15px;margin:16px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:18px;margin:12px 0;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font-size:19px;font-weight:800}
.card.pad0{padding:0;overflow:hidden}
button{font:inherit;font-weight:700;border:0;border-radius:16px;min-height:52px;padding:0 20px;background:var(--grad);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default;transform:none}
button.sec{background:var(--card);color:var(--pri);border:1.5px solid var(--bd)}
button.gray{background:var(--bd);color:var(--tx)}
button.link{background:none;color:var(--pri);min-height:48px;padding:0 8px}
button.link.danger{color:var(--rt)}
button.sm{min-height:48px;padding:0 14px;font-size:15px;border-radius:14px}
button.block{width:100%}
button.round{width:48px;height:48px;min-height:48px;border-radius:50%;padding:0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
a{color:var(--pri);font-weight:600}
a.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;background:#b91c1c;color:#fff;text-decoration:none;font-weight:700;margin-top:12px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}
.chips.c3{grid-template-columns:repeat(3,1fr)}
button.chip{min-height:48px;padding:0 4px;border-radius:14px;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);font-weight:600;font-size:15px}
button.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll button.chip{flex:none;padding:0 16px;white-space:nowrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;min-height:48px;padding:0 6px;background:transparent;color:var(--mut);border-radius:12px;font-size:15px;font-weight:600}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.hero{background:var(--grad);color:#fff;border-radius:28px;padding:16px 18px 14px;margin:12px 0;box-shadow:0 16px 36px var(--soft2);position:relative;overflow:hidden}
.hero.rest{background:linear-gradient(135deg,#334155,#475569);box-shadow:var(--sh)}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero>*{position:relative;z-index:1}
.hero .seg{background:rgba(0,0,0,.26);border:0}
.hero .seg button{color:#fff}
.hero .seg button.on{background:#fff;color:#0e1a18;box-shadow:none}
.hero .big{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.2);margin:18px 0 12px}
.hero h2{margin:0;font-size:27px;line-height:1.12;letter-spacing:-.03em;font-weight:800}
.hero p{margin:6px 0 16px;font-size:16px}
.hero button.white{background:#fff;color:#0e1a18;min-height:58px;font-size:18px;width:100%}
.hero button.ghost{background:transparent;color:#fff;min-height:48px;width:100%;margin-top:4px;font-weight:600}
.pill{display:inline-flex;align-items:center;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--bd);color:var(--tx)}
.pill.ok{background:rgba(22,163,74,.16);color:var(--okt)}
.pill.warn{background:rgba(217,119,6,.18);color:var(--wt)}
.pill.red{background:rgba(220,38,38,.14);color:var(--rt)}
.note{border-radius:16px;padding:12px 14px;font-size:15px;margin:12px 0;background:rgba(217,119,6,.12);border:1px solid rgba(217,119,6,.35)}
.alert{border-radius:20px;padding:16px;margin:12px 0;background:rgba(220,38,38,.10);border:1.5px solid rgba(220,38,38,.55)}
.alert b{color:var(--rt)}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--bd)}
.dots i.on{background:var(--ok)}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .3s}
.bar.done i{background:var(--ok)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;min-height:72px;padding:0;background:none;color:inherit;border-radius:14px;font-weight:inherit}
.strip .sd{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;padding:9px 0 8px;background:var(--bg);color:var(--mut);border-radius:14px;font-size:12px;font-weight:700;border:1.5px solid transparent}
.strip .sd.today{border-color:var(--pri);color:var(--tx);background:var(--soft)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--bd)}
.dot.on{background:var(--ok)}
.prow{display:grid;grid-template-columns:42px 1fr 88px;gap:10px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:20px;margin:8px 0}
.prow.today{border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}
.prow .pd{font-weight:800;font-size:15px;line-height:1.1}
.prow .pd small{display:block;font-size:10px;color:var(--pri);font-weight:700}
.prow .pm{display:flex;gap:3px;background:var(--bg);border-radius:14px;padding:3px}
.prow .pm button{flex:1;flex-direction:column;gap:1px;min-height:50px;padding:4px 0;font-size:10.5px;font-weight:700;background:transparent;color:var(--mut);border-radius:11px}
.prow .pm button.on{background:var(--grad);color:#fff}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;justify-content:flex-start;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;margin:8px 0;min-height:68px;font-weight:700}
.opt small{display:block;color:var(--mut);font-weight:500;font-size:14px}
.opt .ib{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--pri);display:grid;place-items:center;flex:none}
.opt .go{margin-left:auto;color:var(--mut)}
.pick{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);border-radius:18px;padding:12px 14px;margin:8px 0;min-height:0;font-weight:700}
.pick small{display:block;font-weight:500;color:var(--mut);font-size:14px}
.pick.on{border-color:var(--pri);background:var(--soft)}
input[type=number],input[type=time],input[type=text],textarea,select{font:inherit;width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx)}
input[type=number]{width:96px}
input[type=range]{width:100%;height:36px;accent-color:var(--pri)}
.chk{display:flex;gap:12px;align-items:flex-start;margin:12px 0;font-size:16px;min-height:48px}
.chk input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--pri)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:0 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
nav div{pointer-events:auto;display:flex;width:100%;max-width:400px;background:var(--nav);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:28px;padding:6px;box-shadow:0 12px 36px rgba(0,0,0,.18)}
nav button{flex:1;flex-direction:column;gap:2px;min-height:56px;padding:6px 2px;background:none;color:var(--mut);font-size:12px;font-weight:700;border-radius:22px}
nav button.on{background:var(--soft);color:var(--pri)}
.banner{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--warn);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:none;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
:root.dk .banner{color:#1a0f05}
:root.dk .banner button{color:#1a0f05;background:rgba(0,0,0,.14)}
.banner.show{display:flex}
.banner button{background:rgba(0,0,0,.22);color:#fff;min-height:48px;padding:0 14px;border-radius:12px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;z-index:10;display:none}
.overlay.show{display:block}
#runner{background:var(--bg);overflow:auto}
#sheet{background:rgba(6,12,11,.55)}
#sheet.show{display:flex;align-items:flex-end}
#sheet .sheetin{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
#sheet .sheetin h2{margin:0 0 6px;font-size:22px;font-weight:800}
.grab{width:42px;height:5px;border-radius:9px;background:var(--bd);margin:4px auto 14px}
#sheet.full{background:var(--bg)}
#sheet.full .sheetin{border-radius:0;max-height:none;height:100%;background:var(--bg);padding-top:0;animation:none}
.shead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.shead b{font-size:22px;font-weight:800;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.run{--rc:var(--pri);--rcs:var(--soft);min-height:100%;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(180deg,var(--rcs),var(--bg) 60%)}
.run>*{width:100%;max-width:600px;margin-left:auto;margin-right:auto}
.run.k-mod{--rc:var(--warn);--rcs:rgba(217,119,6,.16)}
.run.k-easy{--rc:var(--ok);--rcs:rgba(22,163,74,.14)}
.run.k-rest{--rc:var(--mut);--rcs:rgba(100,116,139,.14)}
.rtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rmeta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-top:4px}
.rmeta b{color:var(--rc)}
.run h2{font-size:30px;text-align:center;margin:14px 0 4px;color:var(--rc);line-height:1.15;font-weight:800}
.run p{text-align:center;font-size:18px;margin:8px 0}
.run p.next{color:var(--mut);font-size:15px}
.ringbox{position:relative;width:236px;height:236px;margin:8px auto}
.ringbox .t{position:absolute;inset:0;display:grid;place-items:center;font-size:58px;font-weight:800;color:var(--rc);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.repbox{margin:14px auto;padding:26px 20px;border-radius:26px;background:var(--card);border:2px solid var(--rc);font-size:34px;font-weight:800;text-align:center;color:var(--rc);box-shadow:var(--sh)}
.rbtn{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rbtn button.big{width:100%;min-height:62px;font-size:19px;background:var(--rc);color:#fff}
:root.dk .rbtn button.big{color:#0a0f0f}
.hist{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:8px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.hist i{width:100%;border-radius:8px 8px 0 0;background:var(--bd);min-height:4px}
.hist i.ok{background:var(--ok)}.hist i.cur{background:var(--pri)}
.hist span{font-size:11px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--bd);padding:7px 4px;text-align:left;vertical-align:top}
.sess{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.sess:first-child{border-top:0}
ul.l{margin:6px 0;padding-left:20px}
ul.l li{margin:5px 0}
details{border-top:1px solid var(--bd);padding:4px 0}
summary{cursor:pointer;font-weight:700;min-height:48px;display:flex;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary:after{content:"›";margin-left:auto;font-size:22px;color:var(--mut);transition:transform .15s}
details[open] summary:after{transform:rotate(90deg)}
.swatches{display:flex;gap:12px}
button.swatch{width:48px;height:48px;min-height:48px;border-radius:50%;padding:0;border:3px solid var(--card);box-shadow:0 0 0 2px var(--bd)}
button.swatch.on{box-shadow:0 0 0 3px var(--tx)}
.hero-title{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:calc(24px + env(safe-area-inset-top)) 0 6px}
.ev{border-top:1px solid var(--bd);padding:16px 0}
.ev:first-of-type{border-top:0;padding-top:6px}
.ev h3{margin:8px 0 6px;font-size:18px}
.ev p{margin:6px 0;font-size:15px}
.pill.n{background:var(--bd);color:var(--tx)}
.src{display:flex;align-items:center;min-height:48px;padding:0 2px;font-size:15px;border-top:1px solid var(--bd)}
.srcs{margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
 body>*:not(#sheet){display:none!important}
 #sheet{position:static!important;display:block!important;background:#fff!important}
 #sheet .sheetin{background:#fff!important;color:#000!important;padding:0!important;max-height:none!important;height:auto!important}
 .noprint,.shead button{display:none!important}
 body{background:#fff;padding:0}
 .mut,td,th{color:#000!important}
}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<main id="app"></main>
<nav><div id="tabs"></div></nav>
<section id="runner" class="overlay"></section>
<section id="sheet" class="overlay"></section>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ Utilidades ============ */
const KEY='pernas-em-dia-v2';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>new Date(k+'T12:00:00');
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const daysSince=k=>Math.round((parseKey(todayKey())-parseKey(k))/864e5);
const fmtDate=k=>{const d=parseKey(k);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const dowOf=k=>parseKey(k).getDay();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>`${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;
const setText=(id,t)=>{const e=$(id);if(e)e.textContent=t};
const bar=(v,m)=>{const p=Math.min(100,Math.round(v/Math.max(1,m)*100));return `<div class="bar ${p>=100?'done':''}"><i style="width:${p}%"></i></div>`};
const DOW=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DOWS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const ORDER=[1,2,3,4,5,6,0];
const LV=['Nada','Leve','Moderado','Forte'];
const LVV=[0,3,6,9];
const lvIdx=v=>v<=0?0:v<=3?1:v<=6?2:3;

/* ============ Ícones ============ */
const I={
 home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
 chart:'<path d="M4 20V11M10 20V4M16 20v-6M21 20H3"/>',
 gear:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
 pin:'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
 dumbbell:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
 sprout:'<path d="M12 21V11M12 11C12 7 9 5 5 5c0 4 2 6 7 6zM12 14c0-3 2-5 6-5 0 3-2 5-6 5z"/>',
 chair:'<path d="M7 4v8h10M7 12v8M17 12v8M7 16h10"/>',
 person:'<circle cx="12" cy="5" r="2"/><path d="M12 8v7M8 11h8M10 21l2-6 2 6"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 chev:'<path d="M9 6l6 6-6 6"/>',
 volOn:'<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
 volOff:'<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>',
 pause:'<path d="M8 5v14M16 5v14"/>',
 play:'<path d="M7 5l12 7-12 7z"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 file:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',

/* ============ Segurança: check-in diário ============ */
function gate(ci){
  if(!ci)return{lv:'none',msg:'Faça o check-in de hoje antes de treinar.'};
  const f=ci.flags||[];
  if(f.includes(3))return{lv:'emergency',msg:'Esses sinais podem indicar algo grave. Ligue 192 (SAMU) ou vá a um pronto-socorro agora. Não faça exercícios.'};
  if(f.length)return{lv:'stop',msg:'Não treine hoje. Esses sinais precisam de avaliação médica: fale com sua médica ou procure atendimento ainda hoje.'};
  if(ci.pain>=7||ci.swell>=8)return{lv:'rest',msg:'Dor ou inchaço altos hoje: só alongamento e pausas leves. Se continuar assim por dias, fale com sua médica.'};
  if(ci.pain>=4||ci.swell>=6)return{lv:'light',msg:'Volume reduzido hoje: sessões mais curtas e sem os exercícios mais exigentes. Observe como as pernas respondem.'};
  return{lv:'ok',msg:'Tudo certo para o plano de hoje.'};
}
const canDo=k=>{const g=gate(D().ci).lv;
  if(g==='stop'||g==='emergency')return false;
  return HEAVY.includes(k)?(g==='ok'||g==='light'):true};

const weekKeys=()=>Array.from({length:7},(_,i)=>addDays(S.weekStart,i));
function statsFor(keys){
  let aero=0,str=0,brk=0,flags=0,ci=0;const sw=[],pn=[];
  for(const k of keys){const d=S.days[k];if(!d)continue;
    for(const s of d.sessions){
      if(s.kind==='walk'||s.kind==='cardio')aero+=s.min;
      else if(s.kind==='strength')str++;
      else if(s.kind==='break'||s.kind==='stretch')brk++;}
    if(d.ci){ci++;sw.push(d.ci.swell);pn.push(d.ci.pain);if((d.ci.flags||[]).length)flags++}}
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:null;
  return{aero,str,brk,swell:avg(sw),pain:avg(pn),flags,ci};
}
const weekStats=()=>statsFor(weekKeys());

function buildWalk(kind,light){
  const p=prog();
  const total=Math.max(8,Math.round(p.sess*(light?0.6:1)));
  const warm=total>=20?3:2,cool=total>=20?3:2;
  const mod=light?1:p.mod,easy=light?2:p.easy;
  const names=['Marcha rápida no lugar','Passos laterais','Marcha com joelhos altos'];
  const st=[];let main=total-warm-cool,isMod=true,n=0;
  st.push(T('Aquecimento',kind==='walk'?'Caminhe em ritmo leve: dá para conversar e até cantar.':'Marcha leve no lugar, com balanço natural dos braços.',warm*60,'warm'));
  while(main>0){
    const len=Math.min(isMod?mod:easy,main);
    if(isMod)st.push(T(kind==='walk'?'Ritmo moderado':names[n++%names.length],
      kind==='walk'?'Passos mais rápidos e respiração mais forte, mas ainda consegue falar frases inteiras (teste da fala).':'Ritmo mais forte, sem pulos. Você deve conseguir falar frases, mas não cantar.',len*60,'mod'));
    else st.push(T('Ritmo leve','Reduza o ritmo para recuperar o fôlego.',len*60,'easy'));
    main-=len;isMod=!isMod;
  }
  st.push(T('Desaceleração','Diminua o ritmo aos poucos e respire fundo.',cool*60,'cool'));
  st.push(...stretchSteps().slice(0,2));
  return st;
}
function buildStrength(light){
  const p=prog();
  const sets=light?Math.max(1,p.sets-1):p.sets,f=light?0.7:1;
  const list=HOME_EX.filter(e=>!(e.minLevel>p.lvl)&&!(light&&e.id==='wall'));
  const st=[T('Aquecimento','Marcha leve no lugar e círculos com os tornozelos.',120,'warm')];
  list.forEach((e,ei)=>{
    for(let s=1;s<=sets;s++){
      const title=`${e.n} · série ${s}/${sets}`;
      if(e.secs)st.push(T(title,e.how,Math.max(8,Math.round(e.secs[p.lvl]*f)),'work'));
      else st.push(Rp(title,e.how,`${Math.max(5,Math.round(e.reps[p.lvl]*f))} repetições${e.side?' de cada lado':''}`,'work'));
      const last=(s===sets&&ei===list.length-1);
      if(!last)st.push(T('Descanse',s<sets?`Respire. Próxima série: ${e.n}.`:`Respire. Próximo exercício: ${list[ei+1].n}.`,s<sets?45:60,'rest'));
    }
  });
  st.push(...stretchSteps());
  return st;
}
function buildSteps(kind,light){
  if(kind==='walk'||kind==='cardio')return buildWalk(kind,light);
  if(kind==='strength')return buildStrength(light);
  if(kind==='stretch')return [ankle(40),...stretchSteps()];
  return ROUT[kind];
}

/* ============ Plano semanal e sugestão do dia ============ */
function planCheck(){
  const p=prog();
  const modes=ORDER.map(i=>S.plan[i].mode);
  const casa=modes.filter(m=>m==='casa').length,rua=modes.filter(m=>m==='rua').length,desc=modes.filter(m=>m==='descanso').length;
  const act=casa+rua,need=Math.ceil(p.aero/p.sess);
  const ok=act>=need;
  return{casa,rua,desc,ok,msg:ok?`Seu plano cobre a meta da semana ${S.week}: ${p.aero} min de aeróbico, cerca de ${need} dias de ${p.sess} min.`:`Para a meta da semana ${S.week} (${p.aero} min de aeróbico) você precisa de cerca de ${need} dias ativos de ${p.sess} min. Seu plano tem ${act}.`};
}
const durFor=(kind,light)=>{const p=prog();return kind==='walk'||kind==='cardio'?Math.max(8,Math.round(p.sess*(light?0.6:1)))+' min':kind==='strength'?'~15 min':'~4 min'};
function suggest(){
  const p=prog(),ws=weekStats(),d=D(),g=gate(d.ci),place=modeFor(todayKey());
  if(g.lv==='stop'||g.lv==='emergency'||g.lv==='none')return null;
  if(g.lv==='rest')return{kind:'stretch',rest:true,reason:'Dor ou inchaço altos: só alongamento hoje.'};
  if(place==='descanso')return{kind:'stretch',rest:true,reason:'Hoje é descanso no seu plano. Alongar é opcional.'};
  const idx=Math.min(6,Math.max(0,daysSince(S.weekStart)));
  const daysLeft=Math.max(1,7-idx);
  const needStr=p.str-ws.str,aeroLeft=p.aero-ws.aero;
  const todayStr=d.sessions.some(s=>s.kind==='strength');
  const todayAero=d.sessions.filter(s=>s.kind==='walk'||s.kind==='cardio').reduce((a,s)=>a+s.min,0);
  const y=S.days[addDays(todayKey(),-1)];
  const yStr=!!y&&y.sessions.some(s=>s.kind==='strength');
  if(needStr>0&&!todayStr&&!yStr&&(place==='casa'||needStr>=daysLeft))
    return{kind:'strength',reason:`Força: ${ws.str} de ${p.str} nesta semana.${place==='rua'?' Faça ao chegar em casa.':''}`};
  if(aeroLeft>0&&todayAero<p.sess*0.8)
    return{kind:place==='rua'?'walk':'cardio',reason:`Faltam ${aeroLeft} min de aeróbico na semana.`};
  return{kind:'stretch',done:true,reason:'Se quiser, alongue um pouco.'};
}
function setPlanMode(i,m){
  S.plan[i].mode=m;
  if(i===new Date().getDay()&&S.days[todayKey()])S.days[todayKey()].place=null;
  S.preset=null;save();
}
function applyPreset(k){
  const pr=PRESETS[k];if(!pr)return;
  pr.m.forEach((m,i)=>{S.plan[i].mode=m});
  if(S.days[todayKey()])S.days[todayKey()].place=null;
  S.preset=k;save();
}

/* ============ Revisão semanal ============ */
function weekReview(){
  const p=prog(),ws=weekStats(),prev=S.history[S.history.length-1];
  const why=[];let rec;
  const swUp=prev&&prev.swell!=null&&ws.swell!=null&&ws.swell-prev.swell>=1.5;
  if(ws.flags>0){rec='repetir';why.push('Houve dia com sinal de alerta. Converse com sua médica antes de aumentar a carga.')}
  else if((ws.pain!=null&&ws.pain>=6)||(ws.swell!=null&&ws.swell>=7)){rec='reduzir';why.push('Dor ou inchaço médios altos. Vale reduzir a carga e falar com sua médica.')}
  else if(swUp||(ws.pain!=null&&ws.pain>=4.5)){rec='repetir';why.push(swUp?'O inchaço médio subiu em relação à semana anterior.':'A dor média ficou acima do ideal.')}
  else if(ws.ci<3){rec='repetir';why.push('Poucos check-ins na semana. Sem eles não dá para avaliar com segurança.')}
  else if(ws.aero<p.aero*0.7||ws.str<Math.min(2,p.str)){rec='repetir';why.push('O volume da semana ficou abaixo de 70% da meta aeróbica ou abaixo de 2 treinos de força.')}
  else{rec='avancar';why.push('Volume cumprido e sintomas estáveis.')}
  return{ws,p,prev,rec,why,block:ws.flags>0};
}
function closeWeek(dec){
  const r=weekReview();
  S.history.push({week:S.week,start:S.weekStart,aero:r.ws.aero,aeroT:r.p.aero,str:r.ws.str,strT:r.p.str,swell:r.ws.swell,pain:r.ws.pain,flags:r.ws.flags,ci:r.ws.ci,dec});
  if(dec==='avancar')S.week=Math.min(S.week+1,PROG.length);
  if(dec==='reduzir')S.week=Math.max(1,S.week-1);
  S.weekStart=todayKey();save();closeSheet();render();window.scrollTo(0,0);
}

  <div class="card"><label class="chk" style="margin-top:0"><input type="checkbox" id="ob_ok" ${OB?'checked':''}> <span>Entendo que o app não é médico nem substitui minha médica, e que devo procurar atendimento se tiver sinais de alerta.</span></label>
   <button class="block" data-act="onboard">Começar</button></div>`;
}

function ciForm(){
  const row=(f,label)=>`<div class="lab">${label}</div><div class="chips">${LV.map((n,i)=>{const on=CI[f]!==null&&lvIdx(CI[f])===i;return `<button class="chip ${on?'on':''}" data-act="cis" data-f="${f}" data-v="${LVV[i]}" aria-pressed="${on}">${n}</button>`}).join('')}</div>`;
  const ready=CI.swell!==null&&CI.pain!==null;
  return `<div class="card"><h2>Como estão suas pernas hoje?</h2><p class="mut" style="margin:0">O app ajusta o treino ao que você sente.</p>
   ${row('swell','Inchaço atrás do joelho')}${row('pain','Dor ou desconforto')}
   <button class="block" style="margin-top:16px" data-act="ciok" ${ready?'':'disabled'}>Confirmar</button>
   <div class="row" style="justify-content:center;margin-top:4px"><button class="link danger" data-act="cialert">Tenho um sinal de alerta</button>${EDIT?'<button class="link" data-act="cicancel">Cancelar</button>':''}</div></div>`;
}
function ciSummary(ci,g){
  const pill={ok:['ok','Liberado'],light:['warn','Volume reduzido'],rest:['warn','Só alongar'],stop:['red','Treino suspenso'],emergency:['red','Emergência']}[g.lv];
  return `<div class="card"><div class="row sp" style="flex-wrap:nowrap"><div><div class="eyebrow">Pernas hoje</div><b>Inchaço ${LV[lvIdx(ci.swell)].toLowerCase()} · Dor ${LV[lvIdx(ci.pain)].toLowerCase()}</b></div><span class="pill ${pill[0]}">${pill[1]}</span></div>
   ${g.lv==='light'||g.lv==='rest'?`<p class="mut" style="margin:8px 0 0">${esc(g.msg)}</p>`:''}
   <button class="link" style="margin:4px 0 -8px -8px" data-act="ciedit">Alterar</button></div>`;
}
function mainCard(g,mode){
  const sg=suggest();if(!sg)return '';
  const m=KINDS[sg.kind],light=g.lv==='light'&&HEAVY.includes(sg.kind);
  const rest=sg.rest&&true;
  const title=g.lv==='rest'?'Descanso ativo':sg.rest?'Dia de descanso':sg.done?'Meta de hoje cumprida':m.n;
  const label=sg.rest?'Alongar agora':sg.done?'Alongar':'Começar';
  return `<div class="hero ${rest?'rest':''}">${seg(mode,x=>`data-act="place" data-v="${x}"`)}
   <div class="big">${ic(m.ic,28)}</div><h2>${title}</h2>
   <p>${durFor(sg.kind,light)} · ${esc(sg.reason)}${light?' Versão leve hoje.':''}</p>
   <button class="white" data-act="start" data-v="${sg.kind}">${ic('play',20)} ${label}</button>
   <button class="ghost" data-act="more">Outras opções</button></div>`;
}
function lastMoveText(){
  const d=S.days[todayKey()],t=d&&d.sessions.length?Math.max(...d.sessions.map(s=>s.ts||0)):0;
  if(!t)return 'Nenhuma pausa hoje ainda';
  const m=Math.max(0,Math.round((Date.now()-t)/60000));
  return m<1?'Última atividade agora':m<60?`Última atividade há ${m} min`:`Última atividade há ${Math.floor(m/60)} h ${m%60} min`;
}
function viewHoje(){
  if(!S.onboarded)return viewOnboard();
  const p=prog(),ws=weekStats(),d=D(),g=gate(d.ci),idx=daysSince(S.weekStart),mode=modeFor(todayKey());
  const brk=d.sessions.filter(s=>s.kind==='break'||s.kind==='stretch').length;
  let h=pageTop(greeting(),new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}));
  if(g.lv==='emergency'||g.lv==='stop')h+=`<div class="alert"><b>${g.lv==='emergency'?'Atenção':'Hoje não treine'}</b><p style="margin:6px 0 0">${esc(g.msg)}</p>${g.lv==='emergency'?`<a class="btn" href="tel:192">${ic('phone',20)} Ligar 192 (SAMU)</a>`:''}</div>`;
  if(idx>=7)h+=`<div class="card"><h2>Semana concluída</h2><p class="mut" style="margin:0 0 12px">Veja o resumo e decida se avança, repete ou reduz a carga.</p><button class="block" data-act="review">Revisar a semana</button></div>`;
  if(!d.ci||EDIT)h+=ciForm();
  else{h+=ciSummary(d.ci,g);if(g.lv!=='stop'&&g.lv!=='emergency')h+=mainCard(g,mode)}
  if(new Date().getHours()>=SH().e&&d.ci&&g.lv!=='stop'&&g.lv!=='emergency'&&!d.sessions.some(s=>s.sub==='elev'))h+=`<button class="opt" style="margin:12px 0" data-act="start" data-v="elev"><span class="ib">${ic('bed',22)}</span><span>Fim do turno: pernas para cima<small>10 min deitado. Opcional. Evidência limitada.</small></span><span class="go">${ic('chev',18)}</span></button>`;
  h+=`<div class="card"><div class="row sp" style="flex-wrap:nowrap"><div><div class="eyebrow">Pausas ativas</div><b>${brk} de ${p.brk} hoje</b><div class="mut" style="font-size:14px" id="lastmove">${lastMoveText()}</div></div><div class="dots" aria-hidden="true">${Array.from({length:p.brk},(_,i)=>`<i class="${i<brk?'on':''}"></i>`).join('')}</div></div>
   <div class="row" style="margin-top:12px;flex-wrap:nowrap;gap:8px"><button class="sec" style="flex:1;padding:0 6px" data-act="start" data-v="micro" ${canDo('micro')?'':'disabled'}>${ic('pulse',20)} 1 min</button><button class="sec" style="flex:1;padding:0 6px" data-act="start" data-v="sit" ${canDo('sit')?'':'disabled'}>${ic('chair',20)} Sentado</button><button class="sec" style="flex:1;padding:0 6px" data-act="start" data-v="stand" ${canDo('stand')?'':'disabled'}>${ic('person',20)} Em pé</button></div>
   <div class="row sp" style="margin-top:6px"><span class="mut" style="font-size:14px">1 min e Sentado: só com o carro parado.</span><button class="link" data-act="science">Por que pausar?</button></div></div>`;
  h+=`<div class="card"><div class="row sp" style="flex-wrap:nowrap"><div class="row" style="gap:14px;flex-wrap:nowrap">${ring(overallPct(),64,8,'var(--pri)','var(--bd)')}<div><div class="eyebrow">Semana ${S.week} de ${PROG.length}</div><b>${ws.aero} de ${p.aero}&nbsp;min</b><div class="mut">Força ${ws.str} de ${p.str}</div></div></div><button class="link" data-act="tab" data-v="progresso">Progresso ${ic('chev',16)}</button></div><div style="margin-top:14px">${weekStrip()}</div></div>`;
  if(d.sessions.length)h+=`<div class="card"><h2>Feito hoje</h2>${d.sessions.map(s=>{const m=kindOf(s);return `<div class="sess"><span class="pill ok">${ic('check',14)}</span><span>${m.n} · ${esc(s.min)} min${s.light?' (leve)':''}${s.dist?` · ${(s.dist/1000).toFixed(2)} km`:''}${s.after?` · pernas ${esc(s.after)}`:''}</span></div>`}).join('')}</div>`;
  h+=`<p class="foot">Este app não substitui sua médica. Pare se sentir dor forte.</p>`;
  return h;
}

function viewSemana(){
  if(!S.onboarded)return viewOnboard();

  return pageTop('Minha semana','Onde e quando treinar')+

   <div class="pm" role="group" aria-label="${DOW[i]}">${['casa','rua','descanso'].map(m=>`<button class="${pl.mode===m?'on':''}" data-act="plan" data-d="${i}" data-v="${m}" aria-pressed="${pl.mode===m}">${ic(MODES[m].ic,20)}<span>${MODES[m].n}</span></button>`).join('')}</div>
   <input type="time" data-time="${i}" value="${esc(pl.time||'')}" ${pl.mode==='descanso'?'disabled':''} aria-label="Horário de ${DOW[i]}"></div>`}).join('')+

   <p class="mut" style="margin:8px 4px 0">Com um horário definido, o app avisa na hora do treino (com o app aberto). Para mudar só o dia de hoje, use a aba Hoje.</p>`;
}

function lineChart(n=21){
  const keys=[];for(let i=n-1;i>=0;i--)keys.push(addDays(todayKey(),-i));
  if(!keys.some(k=>S.days[k]?.ci))return '<p class="mut" style="margin:4px 0 0">Ainda não há check-ins. Faça o primeiro na aba Hoje.</p>';
  const W=320,H=150,L=22,R=8,Tp=8,B=20,iw=W-L-R,ih=H-Tp-B;
  const x=i=>L+iw*i/(n-1),y=v=>Tp+ih*(1-v/10);
  const series=(f,c,sq)=>{let path='',dots='',pen=false;
    keys.forEach((k,i)=>{const ci=S.days[k]?.ci;if(!ci){pen=false;return}
      const px=x(i).toFixed(1),py=y(ci[f]).toFixed(1);path+=(pen?'L':'M')+px+' '+py+' ';pen=true;
      dots+=sq?`<rect x="${(px-3).toFixed(1)}" y="${(py-3).toFixed(1)}" width="6" height="6" style="fill:${c}"/>`:`<circle cx="${px}" cy="${py}" r="3" style="fill:${c}"/>`});
    return `<path d="${path}" fill="none" stroke-width="2.5" stroke-linejoin="round"${sq?' stroke-dasharray="6 4"':''} style="stroke:${c}"/>${dots}`};
  const grid=[0,5,10].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--bd)"/><text x="2" y="${y(v)+4}" font-size="10" style="fill:var(--mut)">${v}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de inchaço e dor nos últimos ${n} dias">${grid}${series('swell','var(--pri)')}${series('pain','var(--warn)',true)}
   <text x="${L}" y="${H-5}" font-size="10" style="fill:var(--mut)">${fmtDate(keys[0])}</text><text x="${W-R}" y="${H-5}" font-size="10" text-anchor="end" style="fill:var(--mut)">hoje</text></svg>
   <div class="row mut"><span><b style="color:var(--pri)">●</b> Inchaço (linha contínua)</span><span><b style="color:var(--wt)">■</b> Dor (tracejada)</span></div>`;
}
function histBars(){
  const p=prog(),ws=weekStats();
  const items=[...S.history.slice(-7).map(h=>({l:'S'+h.week,pct:Math.min(100,Math.round(h.aero/Math.max(1,h.aeroT)*100)),ok:h.aero>=h.aeroT*0.7})),{l:'Atual',pct:Math.min(100,Math.round(ws.aero/p.aero*100)),cur:true}];
  return `<div class="hist">${items.map(i=>`<div><i class="${i.cur?'cur':i.ok?'ok':''}" style="height:${Math.max(4,i.pct)}%"></i><span>${i.l}</span></div>`).join('')}</div><p class="mut" style="margin:6px 0 0">Altura = % da meta aeróbica. Verde = ao menos 70%.</p>`;
}
function viewProgresso(){
  if(!S.onboarded)return viewOnboard();
  const p=prog(),ws=weekStats(),idx=daysSince(S.weekStart);
  return pageTop('Progresso',`Semana ${S.week} de ${PROG.length}`)+
  `<div class="card"><div class="row" style="gap:16px;flex-wrap:nowrap">${ring(overallPct(),84,10,'var(--pri)','var(--bd)')}<div><b style="font-size:18px">${ws.aero} de ${p.aero}&nbsp;min</b><div class="mut">aeróbico moderado</div><b style="font-size:18px">${ws.str} de ${p.str}</b><span class="mut"> treinos de força</span></div></div>
   <p class="mut" style="margin:12px 0">Inchaço médio ${ws.swell??'-'} · Dor média ${ws.pain??'-'} · Check-ins ${ws.ci}/7</p>
   <button class="block ${idx>=7?'':'sec'}" data-act="review">${idx>=7?'Revisar a semana':'Encerrar semana agora'}</button></div>
   <div class="card"><h2>Sintomas (21 dias)</h2>${lineChart()}</div>
   <div class="card"><h2>Semanas</h2>${histBars()}</div>
   <div class="card"><h2>Relatório para a médica</h2><p class="mut" style="margin:0 0 12px">Resumo das últimas semanas, pronto para imprimir ou copiar.</p><button class="sec block" data-act="report">${ic('file',20)} Abrir relatório</button></div>`;
}

const TABS=[['hoje','Hoje','home'],['semana','Semana','cal'],['progresso','Progresso','chart']];

let SETTINGS_OPEN=false,SHEET_LOCK=false,SHEET_FULL=false;
function sheet(html,o={}){
  const el=$('sheet'),old=el.querySelector('.sheetin'),keep=o.keep&&old?old.scrollTop:0;
  SHEET_LOCK=!!o.lock;SHEET_FULL=!!o.full;
  el.className='overlay show'+(o.full?' full':'');
  el.innerHTML=`<div class="sheetin" role="dialog" aria-modal="true">${o.full?`<div class="shead"><b>${o.title||''}</b><button class="round" data-act="closeSheet" aria-label="Fechar">${ic('x',20)}</button></div>`:'<div class="grab"></div>'}${html}</div>`;
  const si=el.querySelector('.sheetin');if(si)si.scrollTop=keep;
}
function closeSheet(){const el=$('sheet');el.className='overlay';el.innerHTML='';SETTINGS_OPEN=false;SHEET_LOCK=false;SHEET_FULL=false}
function ask(title,msg,yesAct,yesLabel,noAct,noLabel,danger){
  sheet(`<h2>${title}</h2><p class="mut" style="margin:0 0 16px">${msg}</p><button class="block ${danger?'':''}" ${danger?'style="background:var(--red)"':''} data-act="${yesAct}">${yesLabel}</button><button class="gray block" style="margin-top:8px" data-act="${noAct}">${noLabel}</button>`);
}
let TT=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('show'),3200)}

function openAlerts(){
  const ci=D().ci;
  sheet(`<h2>Sinais de alerta</h2><p class="mut" style="margin:0">Marque se você tem algum destes sinais agora.</p>
   ${FLAGS.map((f,i)=>`<label class="chk"><input type="checkbox" data-flag="${i}" ${ci&&(ci.flags||[]).includes(i)?'checked':''}> <span>${f}</span></label>`).join('')}
   <button class="block" data-act="cisave">Salvar</button><button class="link block" data-act="closeSheet">Cancelar</button>`);
}
function saveAlerts(){
  const flags=[...document.querySelectorAll('[data-flag]')].filter(c=>c.checked).map(c=>Number(c.dataset.flag));
  const ci=D().ci;
  if(!flags.length&&!ci){closeSheet();return}
  D().ci={swell:CI.swell??(ci?ci.swell:0),pain:CI.pain??(ci?ci.pain:0),flags,note:ci?.note||'',ts:Date.now()};
  EDIT=false;save();closeSheet();render();window.scrollTo(0,0);
}

function buildReport(){
  const rows=[];
  for(let b=0;b<4;b++){
    const end=addDays(todayKey(),-7*b),start=addDays(end,-6);
    const keys=Array.from({length:7},(_,i)=>addDays(start,i));
    const st=statsFor(keys);
    rows.push({per:`${fmtDate(start)} a ${fmtDate(end)}`,aero:st.aero,str:st.str,swell:st.swell==null?'-':st.swell,pain:st.pain==null?'-':st.pain,ci:st.ci,flags:st.flags,brk:st.brk});
  }
  const cis=[];for(let i=13;i>=0;i--){const k=addDays(todayKey(),-i);const c=S.days[k]?.ci;if(c)cis.push({k,c})}
  const head=[`Relatório de acompanhamento - Pernas em Dia`,`Gerado em ${new Date().toLocaleDateString('pt-BR')}`,S.profile.name?`Nome: ${S.profile.name}`:null,`Programa: semana ${S.week} de ${PROG.length} (início da semana atual: ${fmtDate(S.weekStart)})`,S.profile.doctor?`Orientações registradas pela paciente: ${S.profile.doctor}`:null].filter(Boolean);
  const text=[...head,'','Últimas 4 semanas (período | aeróbico min | força | inchaço médio | dor média | check-ins | dias com alerta | pausas):',
    ...rows.map(r=>`${r.per} | ${r.aero} | ${r.str} | ${r.swell} | ${r.pain} | ${r.ci} | ${r.flags} | ${r.brk}`),'',
    'Check-ins dos últimos 14 dias (data | inchaço 0-10 | dor 0-10 | alertas | observação):',
    ...(cis.length?cis.map(({k,c})=>`${fmtDate(k)} | ${c.swell} | ${c.pain} | ${(c.flags||[]).length?'SIM':'não'} | ${c.note||''}`):['Sem check-ins.']),'',
    'Observação: dados de autoavaliação registrados em um app, sem valor de diagnóstico.'].join('\n');
  const html=`<p>${head.map(esc).join('<br>')}</p>
   <table><tr><th>Período</th><th>Aeróbico (min)</th><th>Força</th><th>Inchaço médio</th><th>Dor média</th><th>Check-ins</th><th>Alertas</th><th>Pausas</th></tr>
   ${rows.map(r=>`<tr><td>${r.per}</td><td>${r.aero}</td><td>${r.str}</td><td>${r.swell}</td><td>${r.pain}</td><td>${r.ci}</td><td>${r.flags}</td><td>${r.brk}</td></tr>`).join('')}</table>
   <h3>Check-ins dos últimos 14 dias</h3>
   ${cis.length?`<table><tr><th>Data</th><th>Inchaço</th><th>Dor</th><th>Alerta</th><th>Obs.</th></tr>${cis.map(({k,c})=>`<tr><td>${fmtDate(k)}</td><td>${c.swell}</td><td>${c.pain}</td><td>${(c.flags||[]).length?'SIM':'não'}</td><td>${esc(c.note||'')}</td></tr>`).join('')}</table>`:'<p class="mut">Sem check-ins.</p>'}
   <p class="mut">Escala de 0 (nada) a 10 (máximo). Dados de autoavaliação registrados em um app, sem valor de diagnóstico.</p>`;
  return{text,html};
}
function openReport(){
  sheet(`<div class="card">${buildReport().html}</div>
   <div class="row noprint"><button class="sm" data-act="print">Imprimir / salvar PDF</button><button class="sm sec" data-act="copyrep">Copiar texto</button></div>`,{full:true,title:'Relatório'});
}

function openScience(){

   <div class="card"><h2>Exercícios e hábitos</h2>${EVID.map(card).join('')}</div>
   <div class="card"><h2>Como o app foi desenhado</h2>${DESIGN.map(card).join('')}</div>

let RUN=null,PEND=null,AC=null;
const STEPK={prep:'Preparar',warm:'Aquecimento',work:'Exercício',mod:'Ritmo moderado',easy:'Ritmo leve',rest:'Descanso',cool:'Desaceleração'};
function beep(f=880,d=.25){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=f;g.gain.value=.15;o.start();o.stop(AC.currentTime+d)}catch(e){}}
function speak(t){if(!S.set.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){}}
function cue(s){beep();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}speak(s.k==='prep'?'Prepare-se.':s.secs?`${s.n}. ${s.secs>=60?Math.round(s.secs/60*10)/10+' minutos':s.secs+' segundos'}.`:`${s.n}. ${s.reps}.`)}
const hav=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.la-a.la),dn=r(b.lo-a.lo);const h=Math.sin(dl/2)**2+Math.cos(r(a.la))*Math.cos(r(b.la))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};

async function lockScreen(){try{if(RUN&&navigator.wakeLock)RUN.wl=await navigator.wakeLock.request('screen')}catch(e){}}
function startSession(kind,confirmed){
  const g=gate(D().ci),heavy=HEAVY.includes(kind);
  if(g.lv==='none'&&heavy){sheet('<h2>Primeiro, o check-in</h2><p class="mut" style="margin:0 0 16px">Responda como estão suas pernas hoje para liberar o treino.</p><button class="block" data-act="gotoci">Fazer check-in</button>');return}
  if(!canDo(kind)){sheet(`<h2>Hoje não</h2><p class="mut" style="margin:0 0 16px">${esc(g.msg)}</p><button class="block" data-act="closeSheet">Entendi</button>`);return}
  if((kind==='sit'||kind==='micro')&&!confirmed){sheet(`<h2>O carro está parado?</h2><p class="mut" style="margin:0 0 16px">Faça esta pausa só com o veículo parado, em local seguro. Nunca durante uma corrida.</p><button class="block" data-act="startok" data-v="${kind}">Sim, estou parado</button><button class="gray block" style="margin-top:8px" data-act="closeSheet">Agora não</button>`);return}
  closeSheet();
  const light=g.lv==='light'&&heavy;
  RUN={kind,steps:kind==='elev'?buildSteps(kind,light):[T('Prepare-se','Ajuste a posição. O primeiro passo começa em instantes.',4,'prep'),...buildSteps(kind,light)],i:0,light,startedAt:Date.now(),pausedMs:0,paused:false,dist:0,lb:-1,lastPos:null,watch:null,wl:null};
  const s=RUN.steps[0];if(s.secs)RUN.endAt=Date.now()+s.secs*1000;
  lockScreen();
  if(kind==='walk'&&S.set.gps&&navigator.geolocation){
    RUN.watch=navigator.geolocation.watchPosition(p=>{
      if(!RUN||RUN.paused||p.coords.accuracy>40)return;
      const c={la:p.coords.latitude,lo:p.coords.longitude};
      if(!RUN.lastPos){RUN.lastPos=c;return}
      const m=hav(RUN.lastPos,c);if(m>=5&&m<150){RUN.dist+=m;RUN.lastPos=c}
    },()=>{},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  }
  drawRun();cue(s);
}
function drawRun(){
  const s=RUN.steps[RUN.i],nx=RUN.steps[RUN.i+1],m=KINDS[RUN.kind];
  $('runner').innerHTML=`<div class="run k-${s.k}">
   <div class="rtop"><button class="sm gray" data-act="rend">${ic('x',18)} Encerrar</button><span class="mut" id="r_el"></span><button class="round" data-act="rvoice" aria-label="Voz ${S.set.voice?'ligada':'desligada'}">${ic(S.set.voice?'volOn':'volOff',20)}</button></div>
   <div class="bar"><i id="r_bar"></i></div>
   <div class="rmeta"><span>${m.n}${RUN.light?' · leve':''}</span><b>${STEPK[s.k]||''} · ${RUN.i+1}/${RUN.steps.length}</b></div>
   ${RUN.kind==='sit'||RUN.kind==='micro'?'<div class="note">Só com o veículo parado, em local seguro.</div>':''}
   <h2>${esc(s.n)}</h2>
   ${s.secs?`<div class="ringbox"><svg viewBox="0 0 236 236" width="236" height="236" aria-hidden="true"><circle cx="118" cy="118" r="104" fill="none" stroke-width="12" style="stroke:var(--bd)"/><circle id="r_ring" cx="118" cy="118" r="104" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="653.5" stroke-dashoffset="0" transform="rotate(-90 118 118)" style="stroke:var(--rc)"/></svg><div class="t" id="r_t"></div></div>`:`<div class="repbox" id="r_t"></div>`}
   <p>${esc(s.text)}</p>
   ${nx?`<p class="next">Próximo: ${esc(nx.n)}</p>`:''}
   <div id="r_d" class="mut" style="text-align:center"></div>
   <div class="rbtn">${s.secs?`<button class="big" data-act="rpause">${ic(RUN.paused?'play':'pause',22)} ${RUN.paused?'Continuar':'Pausar'}</button>`:`<button class="big" data-act="rnext">${ic('check',22)} Feito</button>`}<button class="link" data-act="rskip">Pular</button></div></div>`;
  $('runner').classList.add('show');tickRun();
}
function tickRun(){
  if(!RUN)return;
  const s=RUN.steps[RUN.i],now=RUN.paused?RUN.pausedAt:Date.now();
  setText('r_el',fmt(Math.max(0,now-RUN.startedAt-RUN.pausedMs)/1000));
  if(s.secs){
    const left=Math.max(0,Math.ceil((RUN.endAt-now)/1000));
    setText('r_t',fmt(left));
    const rg=$('r_ring');if(rg)rg.setAttribute('stroke-dashoffset',(653.5*(1-Math.min(1,left/s.secs))).toFixed(1));
    if(left<=3&&left>0&&RUN.lb!==left&&!RUN.paused){RUN.lb=left;beep(660,.08)}
  }else setText('r_t',s.reps);
  const br=$('r_bar');if(br)br.style.width=Math.round(RUN.i/RUN.steps.length*100)+'%';
  setText('r_d',RUN.kind==='walk'&&S.set.gps?`${(RUN.dist/1000).toFixed(2)} km`:'');
}
function runTick(){
  if(!RUN||RUN.paused)return;
  let guard=0;
  while(RUN&&!RUN.paused&&guard++<40){
    const s=RUN.steps[RUN.i];
    if(s&&s.secs&&Date.now()>=RUN.endAt)advance(true);else break;
  }
  if(RUN)tickRun();
}
function advance(fromTimer){
  const prev=RUN.steps[RUN.i];
  const base=(fromTimer&&prev.secs)?RUN.endAt:Date.now();
  RUN.i++;
  if(RUN.i>=RUN.steps.length)return finishRun(false);
  const s=RUN.steps[RUN.i];
  if(s.secs)RUN.endAt=base+s.secs*1000;
  RUN.lb=-1;drawRun();cue(s);
}
function stopRun(){
  if(!RUN)return;
  try{RUN.wl&&RUN.wl.release()}catch(e){}
  try{RUN.watch!=null&&navigator.geolocation.clearWatch(RUN.watch)}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
}
function finishRun(partial){
  const r=RUN;stopRun();RUN=null;
  const now=r.paused?r.pausedAt:Date.now();
  const min=Math.max(0,Math.round((now-r.startedAt-r.pausedMs)/60000));
  $('runner').classList.remove('show');$('runner').innerHTML='';
  PEND={kind:r.kind,log:LOGK[r.kind],min,light:r.light,dist:Math.round(r.dist||0),rpe:5,partial};
  const quick=PEND.log==='break'||PEND.log==='stretch'||PEND.log==='rest';
  if(quick){if(partial&&min<1){PEND=null;render();return}PEND.min=Math.max(1,min);savePend({});return}
  if(min<2){PEND=null;sheet('<h2>Sessão muito curta</h2><p class="mut" style="margin:0 0 16px">Não registrei porque durou menos de 2 minutos.</p><button class="block" data-act="closeSheet">OK</button>');render();return}
  endSheet();
}
function endSheet(){
  sheet(`<h2>${PEND.partial?'Sessão encerrada':'Sessão concluída'}</h2><p class="mut" style="margin:0">${KINDS[PEND.kind].n} · ${PEND.min} min${PEND.dist?` · ${(PEND.dist/1000).toFixed(2)} km`:''}</p>
   <div class="lab">Esforço</div><div class="chips c3">${[['Leve',3],['Moderado',5],['Forte',8]].map(([n,v])=>`<button class="chip ${PEND.rpe===v?'on':''}" data-act="eff" data-v="${v}" aria-pressed="${PEND.rpe===v}">${n}</button>`).join('')}</div>
   <div class="lab">Como ficaram as pernas?</div><div class="chips c3">${['melhor','igual','pior'].map(v=>`<button class="chip" data-act="savepend" data-v="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>
   <p class="mut" style="margin:12px 0 0;font-size:14px">Na caminhada e no cardio, o ideal é esforço leve a moderado: dá para falar frases.</p>
   <button class="link block" data-act="discard">Descartar sessão</button>`,{lock:true});
}
function savePend(extra){
  if(!PEND)return;
  const quick=PEND.log==='break'||PEND.log==='stretch'||PEND.log==='rest';
  const s={kind:PEND.log,sub:PEND.kind,min:PEND.min,light:PEND.light,dist:PEND.dist,ts:Date.now(),...(quick?{}:{rpe:PEND.rpe}),...extra};
  D().sessions.push(s);S.last=Date.now();PEND=null;save();
  const msgs=[];
  if(s.after==='pior'){
    const rec=allSessions().filter(x=>x.after).slice(-2);
    msgs.push(rec.length===2&&rec.every(x=>x.after==='pior')?'As pernas pioraram depois das duas últimas sessões. Reduza o volume e converse com sua médica antes de seguir.':'Pernas piores depois do treino: na próxima vez faça uma versão mais leve e observe.');
  }
  if(s.rpe>=8)msgs.push('Esforço forte. Diminua o ritmo na próxima sessão.');
  if((s.kind==='walk'||s.kind==='cardio')&&s.rpe!=null&&s.rpe<=3)msgs.push('Esforço leve. Se estiver confortável, acelere um pouco nos blocos moderados.');
  closeSheet();render();window.scrollTo(0,0);
  if(msgs.length)sheet(`<h2>Registrado</h2>${msgs.map(m=>`<p>${esc(m)}</p>`).join('')}<button class="block" data-act="closeSheet">OK</button>`);
  else if(s.kind==='rest')toast('Descanso registrado.');
  else if(s.kind==='break'||s.kind==='stretch'){const n=D().sessions.filter(x=>x.kind==='break'||x.kind==='stretch').length;toast(`Pausa registrada · ${n} de ${prog().brk} hoje`)}
  else toast('Sessão registrada. Bom trabalho!');
}

/* ============ Instalação, atualização e armazenamento ============ */
let INSTALL=null,PERSIST=null;
const isStandalone=()=>{try{return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}catch(e){return false}};
try{window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL=e;if(SETTINGS_OPEN)openSettings(true)})}catch(e){}
try{window.addEventListener('appinstalled',()=>{INSTALL=null;if(SETTINGS_OPEN)openSettings(true)})}catch(e){}
try{if('serviceWorker'in navigator&&location.protocol!=='file:'){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)showBanner('Nova versão do app pronta.','Atualizar','reload')});
}}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(r=>{PERSIST=r;if(SETTINGS_OPEN)openSettings(true)}).catch(()=>{})}catch(e){}

/* ============ Eventos ============ */
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'&&!SHEET_LOCK&&!SHEET_FULL){closeSheet();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,di=b.dataset.d!=null?Number(b.dataset.d):null;
  if(a==='tab'){e.preventDefault();tab=v;render();window.scrollTo(0,0)}
  else if(a==='onboard'){
    if(!$('ob_ok').checked){toast('Marque a confirmação para continuar.');return}
    S.onboarded=true;S.weekStart=todayKey();S.last=Date.now();save();render();window.scrollTo(0,0);
  }
  else if(a==='preset'){applyPreset(v);render()}
  else if(a==='accent'){S.accent=v;save();refresh()}
  else if(a==='theme'){S.theme=v;save();refresh()}
  else if(a==='plan'){setPlanMode(di,v);render()}
  else if(a==='cis'){const f=b.dataset.f;CI[f]=Number(v);render()}
  else if(a==='ciok'){
    if(CI.swell===null||CI.pain===null)return;
    D().ci={swell:CI.swell,pain:CI.pain,flags:[],note:D().ci?.note||'',ts:Date.now()};
    EDIT=false;save();render();window.scrollTo(0,0);
  }
  else if(a==='ciedit'){const c=D().ci;CI={swell:c?c.swell:null,pain:c?c.pain:null};EDIT=true;render()}
  else if(a==='cicancel'){EDIT=false;render()}
  else if(a==='cialert')openAlerts();
  else if(a==='cisave')saveAlerts();
  else if(a==='gotoci'){closeSheet();tab='hoje';render();window.scrollTo(0,0)}
  else if(a==='closeSheet')closeSheet();
  else if(a==='place'){D().place=v;save();render()}
  else if(a==='more')openMore();
  else if(a==='start')startSession(v);
  else if(a==='startok'){closeSheet();startSession(v,true)}
  else if(a==='science')openScience();
  else if(a==='bannerstart'){$('banner').classList.remove('show');S.last=Date.now();save();if(!RUN){tab='hoje';render();window.scrollTo(0,0);startSession('micro')}}
  else if(a==='rpause'){if(RUN.paused){const dt=Date.now()-RUN.pausedAt;RUN.pausedMs+=dt;if(RUN.endAt)RUN.endAt+=dt;RUN.paused=false}else{RUN.paused=true;RUN.pausedAt=Date.now()}drawRun()}
  else if(a==='rnext'||a==='rskip')advance(false);
  else if(a==='rvoice'){S.set.voice=!S.set.voice;save();if(!S.set.voice){try{speechSynthesis.cancel()}catch(x){}}drawRun()}
  else if(a==='rend'){
    if(!RUN.paused){RUN.paused=true;RUN.pausedAt=Date.now();RUN.autoPaused=true}
    ask('Encerrar a sessão?','Você poderá registrar o que já fez.','rendyes','Encerrar e registrar','rcancel','Continuar sessão');
  }
  else if(a==='rendyes'){closeSheet();if(RUN){RUN.autoPaused=false;finishRun(true)}}
  else if(a==='rcancel'){closeSheet();if(RUN&&RUN.autoPaused){const dt=Date.now()-RUN.pausedAt;RUN.pausedMs+=dt;if(RUN.endAt)RUN.endAt+=dt;RUN.paused=false;RUN.autoPaused=false}if(RUN)drawRun()}
  else if(a==='eff'){if(PEND){PEND.rpe=Number(v);endSheet()}}
  else if(a==='savepend')savePend({after:v});
  else if(a==='discard'){PEND=null;closeSheet()}
  else if(a==='review')openReview();
  else if(a==='closeweek')closeWeek(v);
  else if(a==='manual')openManual();
  else if(a==='savemanual'){const k=$('mn_k').value,m=Math.max(1,Math.min(600,Number($('mn_m').value)||1));D().sessions.push({kind:k,sub:k,min:m,manual:true,ts:Date.now()});S.last=Date.now();save();closeSheet();render();toast('Treino registrado.')}
  else if(a==='report')openReport();
  else if(a==='settings')openSettings();
  else if(a==='remind'){S.set.remind=Number(v);S.last=Date.now();save();refresh()}
  else if(a==='toggle'){S.set[v]=!S.set[v];save();refresh()}
  else if(a==='notif'){if('Notification'in window)Notification.requestPermission().then(()=>toast('Pronto. Os avisos só chegam com o app aberto.'));else toast('Seu navegador não suporta notificações.')}
  else if(a==='closeBanner'){$('banner').classList.remove('show');S.last=Date.now();save()}
  else if(a==='reload')location.reload();
  else if(a==='install'){if(INSTALL){INSTALL.prompt();INSTALL.userChoice.finally(()=>{INSTALL=null;if(SETTINGS_OPEN)openSettings(true)})}}
  else if(a==='print')window.print();
  else if(a==='copyrep'){const t=buildReport().text;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Relatório copiado.')).catch(()=>prompt('Copie o texto:',t))}
  else if(a==='export'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='pernas-em-dia-backup.json';l.click()}
  else if(a==='importbtn')$('imp').click();
  else if(a==='restart')ask('Voltar à semana 1?','O histórico de dias é mantido.','restartyes','Voltar à semana 1','settings','Cancelar');
  else if(a==='restartyes'){S.week=1;S.weekStart=todayKey();save();closeSheet();render()}
  else if(a==='reset')ask('Apagar tudo?','Todo o histórico e as configurações serão apagados deste aparelho. Isso não pode ser desfeito.','resetyes','Apagar tudo','settings','Cancelar',true);
  else if(a==='resetyes'){S=defaults();OB=false;CI={swell:null,pain:null};EDIT=false;save();closeSheet();tab='hoje';render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ob_ok')OB=t.checked;
  if(t.dataset.prof){S.profile[t.dataset.prof]=t.value.trim();save();if(!SETTINGS_OPEN&&S.onboarded)render()}
  if(t.dataset.shift){S.set[t.dataset.shift]=Number(t.value);save()}
  if(t.dataset.time!=null&&t.dataset.time!==''){S.plan[Number(t.dataset.time)].time=t.value||'';save()}
  if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.v!==2)throw 0;S={...defaults(),...o};save();closeSheet();render();toast('Backup importado.')}catch(x){toast('Arquivo inválido.')}};r.readAsText(t.files[0])}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(RUN){lockScreen();runTick()}else checkDay()}});
setInterval(()=>{if(RUN)runTick()},250);

/* ============ Avisos (com o app aberto) ============ */
function showBanner(t,label,act){
  const b=$('banner');b.innerHTML=`<span>${esc(t)}</span><span class="row" style="flex-wrap:nowrap;gap:8px">${act&&act!=='closeBanner'&&act!=='reload'?'<button data-act="closeBanner">Depois</button>':''}<button data-act="${act||'closeBanner'}">${label||'OK'}</button></span>`;b.classList.add('show');
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{if('Notification'in window&&Notification.permission==='granted')new Notification('Pernas em Dia',{body:t})}catch(e){}
}
let LASTDAY=todayKey();
function checkDay(){
  if(todayKey()!==LASTDAY&&!RUN){LASTDAY=todayKey();CI={swell:null,pain:null};EDIT=false;if(!SHEET_LOCK&&!SETTINGS_OPEN)render()}
}
setInterval(()=>{
  checkDay();setText('lastmove',lastMoveText());
  if(!S.onboarded||RUN)return;
  const now=new Date(),k=todayKey(),pl=S.plan[now.getDay()],d=S.days[k],mins=now.getHours()*60+now.getMinutes();
  if(pl&&pl.time&&modeFor(k)!=='descanso'&&!(d&&d.notified)){
    const [hh,mm]=pl.time.split(':').map(Number);
    const done=d&&d.sessions.some(s=>HEAVY.includes(s.kind));
    if(!done&&mins>=hh*60+mm&&mins<hh*60+mm+45){D().notified=true;save();showBanner(`Hora do seu treino (${MODES[modeFor(k)].n}). Abra a aba Hoje.`);return}
  }
  if(S.set.remind&&mins>=SH().s*60&&mins<SH().e*60&&Date.now()-S.last>=S.set.remind*60000){
    showBanner('Hora de uma micro-pausa de 1 minuto. Só com o carro parado.','Fazer agora','bannerstart');
    S.last=Date.now()-S.set.remind*60000+15*60000;save();
  }
},30000);

applyTheme();
render();
</script>
